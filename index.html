/* ===== BUILD 2.0 // JANUS COMPLETE ===== */
:root{
  --blood:#4f1512;
  --cold:#6e8790;
}
body{touch-action:manipulation}
body.shock #app{animation:cameraShock .42s cubic-bezier(.2,.8,.2,1)}
body.door-rumble #app{animation:doorRumble .65s linear}
.screen{transition:filter .5s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
.screen::before{
  content:"";position:fixed;inset:-20%;pointer-events:none;z-index:0;
  background:radial-gradient(circle at 50% 42%,transparent 0 22%,rgba(0,0,0,.18) 47%,rgba(0,0,0,.76) 82%);
}
.screen>*{position:relative;z-index:1}
.typewrite{white-space:pre-wrap}
.typewrite.typing::after{content:"▋";margin-left:2px;color:#a96d29;animation:caretBlink .65s steps(1) infinite}
.reveal-after-type{opacity:0;pointer-events:none;transform:translateY(7px);transition:.45s ease}
.reveal-after-type.ready{opacity:1;pointer-events:auto;transform:none}
.storybox{position:relative}
.storybox::before{content:"";position:absolute;left:-14px;top:0;bottom:0;width:1px;background:linear-gradient(transparent,#5e4020,transparent);opacity:.5}
.storyline{transition:opacity .35s}
.narrative-skip{margin-top:12px;background:none;border:0;color:#55483a;font-size:8px;letter-spacing:.2em}
.flashlight-stage{
  min-height:64svh;position:relative;overflow:hidden;border:1px solid #27221d;
  background:
    linear-gradient(180deg,rgba(35,32,28,.6),rgba(8,8,7,.96)),
    repeating-linear-gradient(91deg,transparent 0 38px,rgba(255,255,255,.013) 39px 40px);
  box-shadow:inset 0 0 100px #000;
  --mx:50%;--my:48%;
}
.flashlight-stage::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:15;
  background:radial-gradient(circle 115px at var(--mx) var(--my),
    transparent 0,rgba(0,0,0,.06) 38%,rgba(0,0,0,.67) 69%,rgba(0,0,0,.97) 100%);
}
.flashlight-stage.lowlight::after{
  background:radial-gradient(circle 78px at var(--mx) var(--my),
    transparent 0,rgba(0,0,0,.1) 32%,rgba(0,0,0,.78) 64%,#000 100%);
}
.room-object{position:absolute;z-index:5;border:0;background:transparent;color:#c9b58f;padding:0}
.room-object::before{content:"";position:absolute;inset:-16px;border:1px solid transparent;border-radius:50%;transition:.2s}
.room-object:hover::before,.room-object:active::before{border-color:#74512a55;background:#bc7b2920}
.obj-door{right:8%;top:16%;width:29%;height:62%;border:2px solid #1f1d1a;background:linear-gradient(90deg,#090909,#191714 45%,#080808);box-shadow:inset 0 0 45px #000}
.obj-door::after{content:"";position:absolute;right:13%;top:50%;width:7px;height:7px;border-radius:50%;background:#7c5729;box-shadow:0 0 10px #a9702d66}
.obj-drain{left:40%;bottom:8%;width:80px;height:28px;border-radius:50%;background:repeating-linear-gradient(90deg,#171717 0 5px,#030303 5px 9px);transform:perspective(80px) rotateX(55deg);box-shadow:0 12px 26px #000}
.obj-scratch{left:8%;bottom:21%;transform:rotate(-6deg);font-family:Georgia,serif;font-size:13px;color:#6f675d;text-align:left;max-width:170px}
.obj-intercom{left:7%;top:15%;width:72px;height:105px;border:1px solid #29251f;background:#0a0908;padding:9px}
.obj-intercom i{display:block;height:48px;background:repeating-linear-gradient(0deg,#24201b 0 2px,transparent 2px 6px)}
.obj-wallmark{left:22%;top:20%;width:26%;height:45%;background:linear-gradient(90deg,transparent,#1d1a17aa,transparent);transform:rotate(1deg)}
.discovery-log{
  position:absolute;z-index:20;left:10px;right:10px;bottom:10px;
  background:#030303df;border-left:2px solid #70461e;padding:10px 12px;
  font-family:Georgia,serif;font-size:12px;line-height:1.55;color:#bfae93;
  backdrop-filter:blur(8px);animation:rise .22s ease;
}
.investigate-meter{display:flex;gap:5px;margin-top:10px}
.investigate-meter span{width:26px;height:3px;background:#25201a}
.investigate-meter span.on{background:#b4772d;box-shadow:0 0 8px #8d571d}
.cipher-reveal{animation:cipherRise .8s ease both}
.cipher-six{background:linear-gradient(95deg,#13110f,#080706);padding:14px;border:1px solid #28231e;box-shadow:inset 0 0 60px #000}
.cipher-line{position:relative;padding-left:10px;border-left:1px solid #2d261e}
.cipher-line:nth-child(4){filter:contrast(.85);text-shadow:3px 0 6px #3e0b08}
.workbench{position:relative;overflow:hidden}
.workbench::after{content:"EVIDENCE IS NOT INSTRUCTION";position:absolute;right:-32px;bottom:12px;transform:rotate(-8deg);font-size:8px;letter-spacing:.22em;color:#4e2c18}
.intercom button{position:relative;overflow:hidden}
.intercom button::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#75441422,transparent);transform:translateX(-110%)}
.intercom button:active::after{animation:sweep .7s linear}
.corridor-scene{
  min-height:100svh;padding:82px 14px 110px;
  background:
   linear-gradient(90deg,#020202 0 7%,transparent 15% 85%,#020202 93%),
   radial-gradient(ellipse at 50% 15%,#31200e 0,#0c0906 25%,#020202 74%);
}
.corridor-ceiling{height:40px;margin:-24px auto 16px;max-width:680px;background:linear-gradient(#080706,#16100a,#050403);clip-path:polygon(8% 0,92% 0,100% 100%,0 100%);opacity:.85}
.corridor-depth{max-width:640px;margin:auto;display:grid;gap:18px;perspective:900px}
.corridor-door{
  min-height:118px;position:relative;width:100%;border:1px solid #29241e;
  background:linear-gradient(90deg,#050505 0 6%,#16130f 6% 94%,#050505 94%);
  box-shadow:inset 0 0 55px #000,0 18px 35px #0009;
  color:#bda781;text-align:left;padding:0;overflow:hidden;transform-origin:top center;
}
.corridor-door:nth-child(n+5){transform:scale(.985)}
.corridor-door.locked{filter:brightness(.45);pointer-events:none}
.corridor-door.completed{filter:brightness(.55)}
.corridor-door .door-slab{position:absolute;inset:8px 13%;border:1px solid #302a22;background:linear-gradient(100deg,#090909,#15120e 50%,#050505)}
.corridor-door .door-copy{position:relative;z-index:4;display:flex;justify-content:space-between;align-items:center;min-height:116px;padding:20px}
.chain-lines{position:absolute;inset:0;z-index:3;pointer-events:none}
.chain-lines::before,.chain-lines::after{content:"";position:absolute;left:-10%;right:-10%;height:5px;background:repeating-linear-gradient(90deg,#171717 0 16px,#4a4032 16px 21px);box-shadow:0 2px 4px #000}
.chain-lines::before{top:37%;transform:rotate(6deg)}
.chain-lines::after{top:62%;transform:rotate(-5deg)}
.door-number{font-family:Arial Black,sans-serif;font-size:28px;color:#4d3923}
.door-amber{width:8px;height:8px;border-radius:50%;background:#d79a3b;box-shadow:0 0 18px #d79a3b;animation:pulse 1.4s infinite}
.corridor-graffiti{font-family:Georgia,serif;font-style:italic;color:#6e5a43;font-size:15px;transform:rotate(-2deg);margin:20px 8px 28px}
.arrival-door-stage{max-width:520px;margin:auto;perspective:900px}
.arrival-door{
  position:relative;height:54svh;min-height:360px;border:1px solid #31291f;
  background:linear-gradient(110deg,#070707,#18140f 48%,#050505);
  box-shadow:inset 0 0 80px #000,0 0 60px #000;
  transform-origin:left center;transition:transform 1.4s cubic-bezier(.25,.8,.15,1),filter .7s;
}
.arrival-door.opening{transform:rotateY(-78deg);filter:brightness(.4)}
.arrival-door .plate{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);text-align:center}
.arrival-door .plate strong{display:block;font-family:Arial Black,sans-serif;font-size:42px;color:#4e3c28}
.arrival-door .plate span{font-size:8px;letter-spacing:.28em;color:#86613a}
.arrival-copy{margin-top:18px;font-family:Georgia,serif;font-size:15px;line-height:1.75;color:#c3b398}
.hold-btn{position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
.hold-btn .holdfill{position:absolute;inset:0 auto 0 0;width:0;background:#7c4a1d24;pointer-events:none}
.hold-btn.holding .holdfill{animation:holdFill 1.35s linear forwards}
.hold-btn span{position:relative;z-index:2}
.photo{transition:transform .25s,filter .25s,box-shadow .25s;touch-action:none}
.photo:hover,.photo:active{transform:scale(1.025) rotate(-.5deg);z-index:8;box-shadow:0 14px 30px #000}
.item{position:relative;transition:.2s}
.item:active{transform:translateY(-3px) rotate(-1deg);border-color:#7b552e}
.item::after{content:"INSPECT";position:absolute;right:8px;top:8px;font-size:7px;letter-spacing:.18em;color:#4b4034}
.vault{position:relative;animation:vaultBreath 5s ease-in-out infinite}
.vault::before{content:"";position:absolute;inset:15%;border:1px dashed #48331e;border-radius:50%;animation:spinSlow 16s linear infinite}
.panel{transition:.15s;box-shadow:inset 0 0 25px #000}
.panel:active{transform:scale(.94)}
.packet .card{transition:.2s}
.packet .card:active{transform:translateX(3px)}
.signature{transition:.25s;position:relative;overflow:hidden}
.signature.on::after{content:"";position:absolute;inset:-20%;background:radial-gradient(circle,#8f581f44,transparent 60%);animation:pulse 1s infinite}
.white-room{position:relative;background:linear-gradient(#f3f3ef,#dddcd6);overflow:hidden}
.white-room::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 40%,transparent 0 30%,#c8c6be55 100%)}
.archive-grid{display:grid;gap:10px;margin-top:18px}
.evidence-card{border:1px solid #2f2922;background:#080706;padding:14px;position:relative}
.evidence-card::before{content:"FILE";position:absolute;right:8px;top:8px;color:#473b2d;font-size:7px;letter-spacing:.2em}
.screen-crack{position:fixed;z-index:55;pointer-events:none;opacity:0}

[data-screen^="trial9"] .screen-crack,[data-screen^="trial10"] .screen-crack{opacity:.3}

function audioCtx(){
  if(!window.__contAudio){
    try{window.__contAudio=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  }
  try{if(window.__contAudio?.state==='suspended')window.__contAudio.resume()}catch(e){}

}
function tone(freq=70,dur=.18,vol=.045,type='sine'){
  if(S.settings?.ambience===false)return;
  let c=audioCtx();if(!c)return;
  try{
    let o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,c.currentTime);
    g.gain.setValueAtTime(vol,c.currentTime);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+dur);
    o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+dur);
  }catch(e){}
}
function noiseHit(dur=.13,vol=.025){
  if(S.settings?.ambience===false)return;let c=audioCtx();if(!c)return;
  try{
    let b=c.createBuffer(1,Math.max(1,c.sampleRate*dur),c.sampleRate),a=b.getChannelData(0);
    for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);
    let s=c.createBufferSource(),g=c.createGain();s.buffer=b;g.gain.value=vol;s.connect(g);g.connect(c.destination);s.start();
  }catch(e){}
}

function architectExtended(q){
const normalized=String(q||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const match=ARCHITECT_TOPICS.find(([rx])=>rx.test(normalized));
if(!match)return null;
const [rx,replies]=match;
const history=(S.intercomLog||[]).filter(x=>x.role==='YOU'&&rx.test(x.text)).length;
const seed=normalized.split('').reduce((a,c)=>a+c.charCodeAt(0),0)+history;
profileAdd('curiosity');
return replies[seed%replies.length]+((history>2&&history%4===0)?' You have returned to this subject before.':'');
}

1:['THE FIRST VOICE','ARCHITECT','You are awake earlier than expected, Subject 13. Do you remember the sound of the door closing?','I remember nothing.','I remember you.','Nothing is an acceptable answer. For now.','Then you know I have spoken to you before.'],
2:['THE WATER IN THE WALLS','SELF','The corridor smells like rain. You hear water moving behind a wall that was dry a moment ago.','Follow the sound.','Keep walking.','The sound follows you instead.','You count your footsteps to drown out the sound. It counts back.'],
3:['THE OBSERVER','ARCHITECT','Do you feel watched because someone is there, or because you have learned to watch yourself?','Who is watching?','I am watching you.','That is a question you have asked before.','Good. Then perhaps you are finally learning.'],
4:['THE PRICE OF SURVIVAL','SELF','Your hands shake. The room ahead demands a sacrifice. Something inside you already knows the price.','I will survive.','What if I refuse?','You repeat it until the words almost sound true.','A voice in your memory says refusal is also a choice.'],
5:['A NAME UNDER THE PAINT','ARCHITECT','Someone scratched a name into the corridor wall. You recognize the handwriting.','Whose name?','Is it mine?','Names are a privilege here.','I did not say you were the first Subject 13.'],
6:['THE OTHER DOOR','SELF','For one breath, you remember sunlight. A bus stop. Someone laughing beside you. Then the memory changes.','Hold on to it.','Let it go.','The laughter remains. The face disappears.','The relief frightens you more than the memory.'],
7:['AN UNFINISHED TRANSMISSION','ARCHITECT','A voice leaked through the intercom while you slept. It said: Do not let him know you remember.','Who said that?','You heard it too?','The transmission was not intended for you.','Of course I heard it. I hear everything.'],
8:['FOOTSTEPS','SELF','Footsteps stop when you stop. For a moment, you are certain there is someone on the other side of the wall.','Call out.','Stay silent.','A whisper answers with your own voice.','The footsteps resume before you move.'],
9:['THE OLD YOU','ARCHITECT','There are things you have said in previous evaluations that I have never been able to forget.','Previous evaluations?','Tell me what I said.','We are not discussing the number of attempts.','You asked me to stop resetting you.'],
10:['DEAD AIR','SELF','The lights flicker in a pattern. It almost feels like a message from someone who knows the corridor better than you.','Count the flashes.','Cover your eyes.','You count seven. On the eighth, the lights stay dark.','Behind your eyelids, the pattern continues.'],
11:['THE QUESTION','ARCHITECT','If the exit required you to leave another person behind, would you still call it freedom?','No.','I do not know.','Then you may understand the purpose of this place.','Uncertainty is the closest you have come to honesty.'],
12:['THE LAST CORRIDOR','SELF','You have walked this corridor before. You know it now, though you cannot say how. The final door feels like a memory.','I want the truth.','I want to leave.','The thought steadies your hands.','For the first time, the desire feels like a decision rather than a reflex.']
};
const BETWEEN_CHAPTERS=[
['The overhead speakers hiss. Somewhere behind the plaster, a relay clicks three times.','You have heard those three clicks before. You are certain of it, even though you cannot remember arriving.','ARCHITECT: You took longer last time.','SELF: Last time? My mouth is dry. I do not remember speaking.','ARCHITECT: You are confusing the absence of memory with the absence of history.'],
['The corridor is wet. A thin stream runs beneath the next door, carrying a piece of paper covered in your handwriting.','You crouch. The writing is smudged, but one sentence survives: DO NOT ANSWER TOO QUICKLY.','ARCHITECT: You have a habit of leaving instructions for yourself.','SELF: If I wrote that, what happened to the person who read it?','ARCHITECT: That depends on whether you consider them the same person.'],
['The lights go out in sequence, one by one, until the only illumination comes from a red diode above the intercom.','A camera moves behind the wall. You hear its motor, then the unmistakable sound of somebody breathing into a microphone.','ARCHITECT: You keep looking for the observer.','SELF: Someone was here. Someone stood where I am standing.','ARCHITECT: And yet you still insist on calling yourself alone.'],
['The floor vibrates as though an enormous machine has started beneath the building.','For a moment your fingers feel numb. A memory surfaces: a hospital corridor, a hand holding yours, an unfinished goodbye.','ARCHITECT: Everything worth keeping has a price.','SELF: That is what people say when they want you to surrender something.','ARCHITECT: Perhaps. But you are still walking toward the door.'],
['A metal shutter drops behind you. The impact makes you flinch before you hear it.','The wall opposite you bears twelve shallow scratches. The fifth is fresh. Your nails ache when you look at it.','ARCHITECT: There are names in this facility that you are not permitted to hear.','SELF: You are afraid I will recognize one.','ARCHITECT: Fear is a human interpretation. I prefer containment.'],
['A telephone rings inside a locked maintenance cabinet. There is no cord leading into it.','You put your ear to the metal. Someone is humming a tune you knew as a child. You cannot remember who taught it to you.','ARCHITECT: Memory is not evidence.','SELF: Then why are you trying so hard to take mine?','ARCHITECT: I have never claimed the memories were yours.'],
['Static floods the intercom. Beneath it, a voice whispers your number, then says not to trust the next answer.','The speaker goes silent. A second later the Architect comes on, unnaturally calm.','ARCHITECT: Disregard that transmission.','SELF: You heard it. You know who it was.','ARCHITECT: I know who it was supposed to be. That is not the same thing.'],
['You hear footsteps ahead of you. They stop when you stop. You take another step; the sound comes from behind.','On the wall is a dark handprint, much smaller than yours. The paint around it is warm.','ARCHITECT: The facility is not empty.','SELF: Then why have you made sure I never meet anyone?','ARCHITECT: You have met them. The difficulty is recognizing them.'],
['A recording begins without warning: your own voice asking to be let out. Then another recording answers, also in your voice.','You cannot tell which one is older. Both sound exhausted. Both use words you would never say.','ARCHITECT: There are versions of you who made different choices.','SELF: What happened to them?','ARCHITECT: That is a question you will regret learning to ask.'],
['The corridor speakers broadcast silence. Even your footsteps seem to arrive a moment late.','You press your palm against the wall. A faint pulse answers from the other side, matching your heartbeat until you move away.','ARCHITECT: Silence is a form of communication.','SELF: Then tell me what you are hiding inside it.','ARCHITECT: You have already heard it. You simply did not understand.'],
['The exit sign flickers between two arrows pointing in opposite directions.','For the first time, you imagine opening a door and finding someone else trapped behind it. The thought is unbearable because it feels familiar.','ARCHITECT: Freedom for one subject may require captivity for another.','SELF: You want me to make that sound reasonable.','ARCHITECT: I want to know whether you will.'],
['The final corridor looks exactly like the first. Same stain on the ceiling. Same three clicks behind the plaster.','You recognize the scratches near the floor. Your own hand made them. The certainty settles into your bones.','ARCHITECT: We have reached the point where you usually ask me to begin again.','SELF: Not this time.','ARCHITECT: You have said that before, too.']
];
function cinematicScene(o){let {eyebrow='',title='',body='',next='',action='CONTINUE',skip='',onSkip='',index=0,total=0}=o;return shell(`<main class="janus-cinema"><div class="cinema-atmosphere" aria-hidden="true"><div class="cinema-light"></div><div class="cinema-door"></div></div><section class="cinema-content"><div class="cinema-top"><span>${esc(eyebrow)}</span><span>SUBJECT 13</span></div>${title?`<h1 class="cinema-title">${esc(title)}</h1>`:''}<div class="cinema-story typewrite" data-type="${esc(body)}" data-reveal="cinemaAdvance"></div><div class="cinema-actions"><button id="cinemaAdvance" class="cinema-next reveal-after-type" onclick="${next}">${esc(action)} <span aria-hidden="true">→</span></button>${skip?`<button class="cinema-skip" onclick="${onSkip}">${esc(skip)}</button>`:''}</div>${total?`<div class="cinema-track" aria-label="Scene ${index+1} of ${total}">${Array.from({length:total},(_,i)=>`<i class="${i<=index?'active':''}"></i>`).join('')}</div>`:''}</section></main>`)}
function betweenTrial(n){let v=BETWEEN_TRIALS[n]||BETWEEN_TRIALS[1],pages=BETWEEN_CHAPTERS[n-1]||BETWEEN_CHAPTERS[0],step=Math.min(4,Math.max(0,Number(S.flags?.['betweenStep'+n]||0))),choice=S.flags?.['betweenChoice'+n];if(step<4)return cinematicScene({eyebrow:'JANUS / INTERVAL '+String(n).padStart(2,'0'),title:v[0],body:pages[step],next:'Game.nextBetween('+n+')',index:step,total:5,skip:'SKIP SCENE',onSkip:'Game.finishBetween('+n+')'});if(choice)return cinematicScene({eyebrow:'JANUS / INTERVAL '+String(n).padStart(2,'0'),title:v[0],body:v[choice===1?5:6],next:'Game.finishBetween('+n+')',action:'ENTER THE NEXT CHAMBER',index:4,total:5});return shell(`<main class="janus-cinema"><div class="cinema-atmosphere" aria-hidden="true"><div class="cinema-light"></div><div class="cinema-door"></div></div><section class="cinema-content"><div class="cinema-top"><span>JANUS / INTERVAL ${String(n).padStart(2,'0')}</span><span>SUBJECT 13</span></div><h1 class="cinema-title">${esc(v[0])}</h1><p class="cinema-story">${esc(pages[4])}</p><div class="cinema-choices"><button onclick="Game.chooseBetween(${n},1)">${esc(v[3])}</button><button onclick="Game.chooseBetween(${n},2)">${esc(v[4])}</button></div><button class="cinema-skip" onclick="Game.finishBetween(${n})">SKIP SCENE</button></section></main>`)}
function setScreen(x){screen=x;render();let sc=document.querySelector('.screen');if(sc)sc.scrollTop=0}
function narrativeInterlude(n){let f=S.flags,step=f['interlude'+n]||0,warning=!!f.t1memory,hidden=!!f.t1tap,record=!!f.t2record,precise=!!f.t3precision;
let pages=n===1?[
"The door opens when you press the plate beneath the handle. You were pulling it. The speaker says, ‘You did that last time.’ You ask what he means. He doesn't answer.",
warning?"You glance back at the warning you found. The speaker clicks on. ‘You've been looking at the wall.’ You keep your eyes on the door. ‘There's a lot of writing,’ you say. ‘Yes,’ he replies. ‘There is.’":"A strip of paper is wedged in the doorframe. It reads: HE ALWAYS TELLS YOU TO PULL. You fold it into your palm before the camera turns.",
hidden?"Three faint taps come from the pipe beside you. You heard them in the first room. You tap back. Somewhere beyond the wall, a woman takes a sharp breath. Then silence.":"The passage smells of damp insulation. There is a narrow inspection window, painted over from the other side.",
"Water is running under the next door. A maintenance label has been peeled away, leaving a clean rectangle on the metal. Above it: CHAMBER 02. The lock closes behind you."
]:n===2?[
"The water drains so quickly that your shoes stick to the floor. You hear someone on the other side of the door trying a handle. When you call out, the noise stops.",
record?"You kept the service record. It bears the same subject number as the door behind you: 13. The date is older than your last clear memory. You hide the paper in your sleeve.":"A service hatch hangs open. Inside is a folder with a clean rectangular space where a record has been removed.",
"Beyond the door is a corridor lined with hospital-green tiles. A trolley stands against the wall. One wheel is wet. The smell of disinfectant makes you think of the headache behind your ear.",
hidden&&record?"Three taps sound through the trolley frame. You crouch. A woman whispers, ‘Don't mention the record in front of the cameras.’ Footsteps approach, and she goes quiet.":"A woman is crying somewhere beyond the lights. You follow the sound toward a door marked INFIRMARY.",
"On a wristband hanging from the door: DR. MARA VOSS. A handwritten time reads 22:46. The speaker says, ‘Tell me what happened to her.’"
]:[
"The case report disappears into a slot in the desk. A printer starts behind the wall. It stops after one line: REVIEW ACCEPTED.",
precise?"You noticed the missing name in the witness register. A page slides out beneath the report: WITNESS FOUR — RECORD WITHHELD. Someone has crossed out the signature, but not the date.":"A thin strip of paper follows the report: SUBJECT RESPONSE RECORDED. There is no explanation.",
hidden&&record&&precise?"Three knocks sound beneath the desk. You answer before you can stop yourself. A woman whispers, ‘Voss left you a choice. Don't let him choose it for you.’ The connection dies.":"The hospital corridor is empty now. The trolley is gone. You cannot find the door you came through.",
"The next chamber contains a chair and three switches. Beside the chair is a clipboard with your subject number. The first question has already been answered in handwriting that looks like yours."
];
return cinematicScene({eyebrow:'JANUS / TRANSFER '+String(n).padStart(2,'0')+'—'+String(n+1).padStart(2,'0'),body:pages[Math.min(step,pages.length-1)],next:'Game.advanceNarrative('+n+')',action:step===pages.length-1?'OPEN THE NEXT DOOR':'CONTINUE',index:step,total:pages.length})}

function trialOneToTwo(){return narrativeInterlude(1)}
function render(){
  let old=document.querySelector('.screen'), keepScroll=old?old.scrollTop:0;
  clearInterval(window.__waterTimer);clearTimeout(window.__cctvTimer);
  document.body.dataset.screen=screen;
  const a=document.getElementById('app');
  a.innerHTML = screen==='splash'?splash():screen==='loading'?loadingScreen():screen==='menu'?menu():screen==='protocols'?protocolHub():screen==='difficulty'?difficultyScreen():screen==='prologue'?prologue():screen==='opening'?opening():screen==='corridor'?corridor():screen==='t1to2'?trialOneToTwo():screen.startsWith('interlude')?narrativeInterlude(Number(screen.replace('interlude',''))):screen==='settings'?settings():screen==='archive'?archiveScreen():screen.startsWith('between')?betweenTrial(Number(screen.replace('between',''))):screen.startsWith('arrival')?arrival(Number(screen.replace('arrival',''))):trial(Number(screen.replace('trial','')));
  bind();
  let now=document.querySelector('.screen');if(now&&keepScroll>0)requestAnimationFrame(()=>{now.scrollTop=keepScroll});
}
function bind(){
  runTypewriters();setupFlashlights();addCrackOverlay();
  if(screen==='trial2')startHighWater();
  if(screen==='trial3'&&S.flags.t3phase==='playing')runCCTVSequence();
  if(S.settings?.ambience!==false&&screen!=='menu')startAmbience();
}

function menu(){let can=S.started||S.completed.length>0,progress=Math.min(12,S.completed.length),next=Math.max(1,Number(S.trial)||1);return `<div class="screen janus-main-menu"><div class="menu-facility" aria-hidden="true"><div class="menu-light"></div><div class="menu-door-frame"><span>13</span></div></div><main class="menu-panel"><div class="menu-overline"><span>VRAXISDEV / INTERACTIVE</span><span>JANUS SYSTEM</span></div><div class="menu-brand"><div class="menu-brand-small">THERE IS NO WAY BACK</div><h1>CONTINUANCE</h1><p>TWELVE CHAMBERS. ONE CONDITIONAL EXIT.</p></div><div class="menu-status"><span class="menu-status-dot"></span><div><strong>${can?'SUBJECT 13 / FILE ACTIVE':'AWAITING NEW SUBJECT'}</strong><small>${can?'CHAMBER '+String(next).padStart(2,'0')+' · '+progress+' OF 12 CLEARED':'YOUR EVALUATION HAS NOT BEGUN'}</small></div></div><div class="menu-commands">${can?`<button class="menu-command main" onclick="Game.resume()"><span>CONTINUE EVALUATION<small>RETURN TO CHAMBER ${String(next).padStart(2,'0')}</small></span><b>→</b></button>`:''}<button class="menu-command ${can?'':'main'}" onclick="Game.newSubject()"><span>${can?'BEGIN NEW SUBJECT':'BEGIN EVALUATION'}<small>${can?'RESTART YOUR JANUS RECORD':'INITIALIZE SUBJECT 13'}</small></span><b>→</b></button><button class="menu-command" onclick="Game.openSelector()"><span>CHAMBER DIRECTORY<small>REVIEW UNLOCKED TRIALS</small></span><b>⌁</b></button></div><div class="menu-utilities"><button onclick="Game.openArchive()">ARCHIVE</button><button onclick="Game.openProtocols()">PROTOCOLS</button><button onclick="Game.openSettings()">SETTINGS</button></div><div class="menu-foot">JANUS / LOCAL RECORD · ${progress}/12 CHAMBERS CLEARED</div></main></div>`}
function protocolHub(){let jp=S.protocols?.JANUS||{},cp=S.protocols?.COXE||{};let progress=Math.min(12,S.completed?.length||0);return `<div class="screen protocol-shell"><div class="protocol-wrap"><div class="protocol-head"><div class="kicker">CONTINUANCE NETWORK // PROTOCOL DIRECTORY</div><h1 style="letter-spacing:.15em;margin:10px 0 6px">ACTIVE PROGRAMS</h1><p class="muted">CONTINUANCE is the host system. Each Protocol is a separate evaluation with its own chambers, rules, story and psychological model.</p></div><div class="protocol-list"><section class="protocol-card"><div class="protocol-status">${jp.completed?'COMPLETE':jp.started||S.started?'ACTIVE':'AVAILABLE'}</div><div class="code">PROTOCOL 01 // JANUS</div><h2>JANUS</h2><p>Memory. Identity. Observation. Twelve chambers between Subject 13 and the exterior — if the exterior exists.</p><div class="protocol-meta"><span>12 TRIALS</span><span>SUBJECT 13</span><span>ARCHITECT</span><span>${progress}/12 SURVIVED</span></div><div class="protocol-actions"><button class="btn" onclick="Game.selectProtocol('JANUS')">${S.started?'ENTER JANUS':'BEGIN JANUS'}</button><button class="btn dim" onclick="Game.openArchive()">ARCHIVE</button></div></section><section class="protocol-card locked"><div class="protocol-status">SEALED</div><div class="code">PROTOCOL 02 // COXE</div><h2>COXE</h2><p>Protocol data exists on the network, but subject authorization has not been issued.</p><div class="protocol-meta"><span>NEW TRIAL SET</span><span>NEW OVERSEER</span><span>CLASSIFIED</span></div><div class="protocol-actions"><button class="btn dim" onclick="Game.coxeLocked()">ACCESS SEALED</button></div></section></div><div class="network-note">NETWORK NOTE // Protocol records are isolated, but selected subject-state can persist across the wider CONTINUANCE Program. Future Protocols can be added without replacing JANUS progress.</div><div class="spacer"></div><button class="btn dim" onclick="Game.home()">RETURN HOME</button></div></div>`}

const PRO=[
"Your first thought is that the car has stopped. Your second is that you cannot hear the rain.\n\nYou are lying on concrete. Your left sleeve is damp. There is a sore place behind your ear.",
"You sit up too quickly and nearly vomit. No windows. A steel door. A strip light that buzzes every few seconds.\n\nYou remember a phone call. Someone saying, ‘You promised eleven.’ You remember reaching for the volume. Then headlights.",
"Your phone is gone. So are your keys.\n\nOn the floor beside your hand is a pale rectangle, cleaner than the concrete around it. Something was removed recently. You wonder how long you have been here.",
"Above the door are twelve small lamps. One is lit.\n\nA speaker clicks. ‘Can you stand?’\n\nYou say nothing.\n\n‘That's fine,’ the voice replies. ‘We can wait.’",
"You pull yourself upright. The speaker clicks again.\n\n‘Subject Thirteen. There are twelve rooms. Each has a condition. Meet it, and the next door opens.’\n\n‘Where am I?’\n\n‘You can ask me that again when you've finished.’",
"At knee height, someone has scratched a sentence into the wall. The letters are small, written where a standing camera might miss them.\n\nDON'T LET HIM KNOW YOU REMEMBER.\n\nYou read it twice. You don't remember anything. That is what frightens you."
];

function corridor(){const names=['THE INSCRIPTION','HIGH WATER','THE VOSS FILE','THE HANDICAP','CHAMBER FIVE','CHAMBER SIX','CHAMBER SEVEN','CHAMBER EIGHT','CHAMBER NINE','CHAMBER TEN','CHAMBER ELEVEN','CHAMBER TWELVE'];let max=Math.max(1,Number(S.trial)||1),doors=names.map((name,i)=>{let n=i+1,done=S.completed.includes(n),available=n<=max;return `<button class="directory-door ${done?'cleared':available?'accessible':'sealed'}" ${available?`onclick="Game.enter(${n})"`:'disabled'}><span class="directory-number">${String(n).padStart(2,'0')}</span><span class="directory-info"><strong>${available?esc(name):'CLASSIFIED'}</strong><small>${done?'CLEARED':available?'AVAILABLE':'SEALED / NO ACCESS'}</small></span><span class="directory-mark">${done?'✓':available?'→':'×'}</span></button>`}).join('');return shell(`<main class="janus-directory"><header class="directory-header"><button class="directory-back" onclick="Game.home()">← BACK</button><span>JANUS / CHAMBER DIRECTORY</span></header><div class="directory-heading"><div class="kicker">SUBJECT 13 / ACCESS RECORD</div><h1>THE TWELVE DOORS</h1><p>The facility keeps a record of every room you survive. Locked chambers remain sealed.</p></div><div class="directory-progress"><span>${S.completed.length} / 12 CLEARED</span><div><i style="width:${Math.min(100,S.completed.length/12*100)}%"></i></div></div><div class="directory-grid">${doors}</div><button class="directory-return" onclick="Game.resume()">RETURN TO CURRENT CHAMBER →</button></main>`)}
function trial(n){let fn=[null,t1,t2,t3,t4,t5,t6,t7,t8,t9,t10,t11,t12,t13][n];return fn?fn():corridor();}
function solvedButton(n,label='TRIAL COMPLETE // RETURN'){return S.completed.includes(n)?`<button class="btn" onclick="${n<=3?'Game.dismissCompletion()':'Game.goCorridor()'}">${n<=3?'CONTINUE THE STORY →':label}</button>`:''}

const T1_VERSES=["The walls remember every name","The ones who left were not the same","The voice above will promise light","But promises can hide the night","The guilty fall upon one knee","And beg for what the cruel won't see"];
function t1(){
  let found=S.flags.t1found||[],ready=found.length>=3||S.flags.t1cipher,order=S.flags.t1order||[3,0,5,2,1,4];
  let lines=["◇⌬⊙ ☍⌂♧☓⊕♢☆♢ ○△⌁ ♤⊕□☆ ⊙♤☆ ⌁⊕⌯♤⊙","⊙♤☆ ✧△⊘⊘♢ ⌂☆☓☆☓◇☆⌂ ☆✦☆⌂✶ ⌁△☓☆","△⌁□ ◇☆⌯ ⌖♧⌂ ✧♤△⊙ ⊙♤☆ ○⌂⌬☆⊘ ✧♧⌁'⊙ ♢☆☆","⊙♤☆ ✦♧⊕○☆ △◇♧✦☆ ✧⊕⊘⊘ ☍⌂♧☓⊕♢☆ ⊘⊕⌯♤⊙","⊙♤☆ ♧⌁☆♢ ✧♤♧ ⊘☆⌖⊙ ✧☆⌂☆ ⌁♧⊙ ⊙♤☆ ♢△☓☆","⊙♤☆ ⌯⌬⊕⊘⊙✶ ⌖△⊘⊘ ⌬☍♧⌁ ♧⌁☆ ⌑⌁☆☆"];
  let inspect=!ready?`<div class="t1-opening"><div class="kicker">JANUS // CHAMBER 01</div><h2>YOU ARE NOT THE FIRST.</h2><p>The concrete is cold enough to burn your bare feet. Somewhere behind the wall, a person takes a breath. The sound stops when you move.</p><p>Above the sealed door, an amber light blinks three times. The speaker clicks. A voice, almost kind: “There is no correct way to be afraid, Thirteen. But there is a correct way to leave.”</p></div><div class="t1-direction">EXPLORE THE ROOM <span>${found.length} / 5 DETAILS DISCOVERED</span></div><div class="flashlight-stage ${S.penalties?.lowLight?'lowlight':''}" id="t1room">
      <button class="room-object obj-intercom" onclick="Game.inspectT1('intercom')"><i></i><span class="small">●</span></button>

      <button class="room-object obj-scratch" onclick="Game.inspectT1('scratch')">DON'T LET HIM<br>KNOW YOU REMEMBER.</button>

      <div style="position:absolute;left:10px;top:10px;z-index:18"><div class="kicker">MOVE YOUR FINGER // FLASHLIGHT</div><div class="investigate-meter">${Array.from({length:3},(_,i)=>`<span class="${i<found.length?'on':''}"></span>`).join('')}</div></div>
    </div>
    <div class="spacer"></div><div class="objective"><b>CURRENT OBJECTIVE</b>Search the chamber. Find something that explains what the door is waiting for.</div>`:'';
  let cipher=ready?`<div class="cipher-reveal"><div class="kicker">INSCRIPTION // TASK 1 OF 2</div><h2>DECODE THE VERSES</h2><p class="muted">Every symbol stands for one letter. Repeated symbols represent the same letter. Decode all six lines.</p><div class="t1-crib"><div class="kicker">A NOTE SCRATCHED BELOW THE INSCRIPTION</div><p>Someone has written three letters beneath the first repeating word. The pencil marks are faint but deliberate.</p><div class="t1-crib-key"><span>⊙ ♤ ☆</span><span>↓ ↓ ↓</span><strong>T H E</strong></div><p class="muted">These three letters are confirmed. Use them to work out the rest of the alphabet.</p></div><div class="wall"><div class="cipher-six">${lines.map((line,i)=>`<div class="cipher-line">${i+1}. ${line}</div>`).join('')}</div></div><div class="workbench"><div class="kicker">SUBSTITUTION WORKBENCH</div><p class="muted">Assign a letter to each symbol. Your guesses are saved automatically.</p><div class="t1-keygrid">${[...new Set(lines.join('').split('').filter(ch=>T1_GLYPHS.includes(ch)))].map(g=>`<label>${g}<select aria-label="Letter for ${g}" ${['⊙','♤','☆'].includes(g)?'disabled':''} onchange="Game.t1Map('${g}',this.value)"><option value="">?</option>${T1_ALPHABET.split('').map(ch=>`<option value="${ch}" ${((S.flags.t1map||{})[g]||({'⊙':'T','♤':'H','☆':'E'})[g])===ch?'selected':''}>${ch}</option>`).join('')}</select></label>`).join('')}</div><button class="btn dim" onclick="Game.t1Hint()">REVEAL ONE LETTER</button><button class="btn" onclick="Game.t1CheckDecode()">VERIFY DECODING</button></div>${S.flags.t1decoded?`<div class="t1-second"><div class="kicker">INSCRIPTION // TASK 2 OF 2</div><h2>RECONSTRUCT THE POEM</h2><p class="muted">Pair the rhymes and follow the meaning. Rearrange the six lines.</p><div class="t1-reorder">${order.map((v,i)=>`<div class="t1-verse"><span>${i+1}</span><p>${esc(T1_VERSES[v])}</p><div><button ${i===0?'disabled':''} onclick="Game.t1Move(${i},-1)" aria-label="Move line up">↑</button><button ${i===5?'disabled':''} onclick="Game.t1Move(${i},1)" aria-label="Move line down">↓</button></div></div>`).join('')}</div><button class="btn" onclick="Game.t1CheckOrder()">VERIFY POEM</button>${S.flags.t1ordered?`<div class="t1-ending"><p>The final word has been erased.</p><p>The speaker asks: “Five letters. What do the guilty beg from those who can punish them?”</p><div class="row"><input id="a1" class="input" placeholder="FINAL WORD"><button class="btn" style="width:auto" onclick="Game.answer1()">SPEAK</button></div></div>`:''}</div>`:''}${solvedButton(1,'THE LOCK IS TURNING')}</div>`:'';
  return shell(`<div class="t1-ui">${header(1,'THE INSCRIPTION')}<main class="wrap">${inspect}${cipher}</main></div>`);
}

let f=S.flags,exam=f.t2exam||[],found=id=>exam.includes(id),solved=S.completed.includes(2);
const info=[['intake','INTAKE MANIFOLD','The first valve is stamped 7. Its arrow points to the FILTER. A scratched note: START WHERE THE WATER ENTERS.'],['filter','FILTER HOUSING','Stamped 2. The filter feeds the PRESSURE REGULATOR, never the drain.'],['regulator','PRESSURE REGULATOR','Stamped 9. A brass arrow points from the regulator to the BYPASS.'],['bypass','BYPASS CONTROL','Stamped 4. The bypass redirects flow to the RESERVOIR.'],['reservoir','RESERVOIR GAUGE','Stamped 1. An engraved line runs from the reservoir to the RELEASE VALVE. A folded corner of paper protrudes behind the gauge. Inspect again to retrieve it.'],['release','RELEASE VALVE','Stamped 8. Its outlet leads to the FINAL DRAIN.'],['drain','FINAL DRAIN','Stamped 3. A warning: THIS MUST BE THE LAST CONTROL.']];

<div class="water-room"><div id="waterFill" class="water-fill"></div><div class="water-content"><div class="row" style="justify-content:space-between"><div class="kicker">HYDRAULIC SYSTEM</div><div id="waterStatus" class="water-status">ANKLE HEIGHT</div></div><p class="muted">Inspect each component to trace the direction of flow. Seven stamped digits form the exit code in the same order.</p><div class="t2-controls">${info.map(([id,title,body],i)=>`<button class="t2-control ${found(id)?'seen':''}" onclick="Game.t2Inspect('${id}')"><span class="t2-controlnum">${String(i+1).padStart(2,'0')}</span><b>${title}</b><span>${found(id)?body:'TAP TO INSPECT'}</span></button>`).join('')}</div><div class="t2-logic"><div class="kicker">CONTROL SEQUENCE</div><p>Start at the intake. Follow each physical connection. The final drain must be last. Record the seven stamped digits in order.</p><div class="t2-progress">${exam.length} / 7 COMPONENTS INSPECTED</div>${f.t2record?`<p class="t2-secret">${esc(f.t2recordNote)}</p>`:''}</div><input id="a2new" class="input code-seven" inputmode="numeric" maxlength="7" autocomplete="off" placeholder="_ _ _ _ _ _ _"><button class="btn" style="margin-top:10px" onclick="Game.answerHighWater()">SUBMIT SEQUENCE</button></div></div>${solved?solvedButton(2,'CONTINUE'):''}</main>`)}

function t3(){

else if(phase==='witnesses'){body=`<div class="kicker">CASE 03 // WITNESS CONTACTS</div><h2>THREE VOICES, THREE VERSIONS</h2><div class="storybox"><p>The Architect opens three remote channels. “Witnesses are not proof, Thirteen. They are people who remember.”</p></div>${CASE3_WITNESSES.map((w,i)=>`<button class="btn dim" style="margin-top:10px" onclick="Game.case3Witness(${i})">${esc(w.title)} ${((f.case3WitnessDone||[]).includes(i))?'// RECORDED':w.req.every(x=>found.includes(x))?'// AVAILABLE':'// REQUIRES EVIDENCE'}</button>`).join('')}<button class="btn dim" onclick="Game.case3Back()">RETURN TO SCENE</button>`;}
else if(phase==='witness'){let i=f.case3WitnessIndex||0,w=CASE3_WITNESSES[i],beat=f.case3WitnessBeat||0;body=`<div class="kicker">REMOTE TESTIMONY // ${esc(w.title)}</div><div class="storybox"><p>${esc(w.lead)}</p></div><div class="card amber case3-dialogue"><p style="line-height:1.9">${esc(w.beats[beat])}</p></div><button class="btn" onclick="Game.case3WitnessNext()">${beat===w.beats.length-1?'CLOSE TESTIMONY':'CONTINUE CONVERSATION'}</button><button class="btn dim" onclick="Game.case3WitnessList()">RETURN TO CONTACTS</button>`;}
else if(phase==='interrogate'){let count=f.case3Questions||0,limit=f.case3Extra?10:5,thread=f.case3Thread,beat=f.case3Beat||0,available=CASE3_QUESTIONS.filter(q=>q.req.every(r=>found.includes(r))&&!(f.case3Asked||[]).includes(CASE3_QUESTIONS.indexOf(q)));body=`<div class="kicker">INTERROGATION // ELIAS VALE</div><h2>THE MAN BEHIND THE GLASS</h2><div class="storybox"><p>Elias sits beneath a single lamp. He has been told that you are a prisoner, not a detective. He keeps glancing at the camera.</p></div><div class="muted">INTERROGATION THREADS USED: ${count} / ${limit}</div>${f.case3LastResponse?`<div class="storybox"><p>${esc(f.case3LastResponse)}</p></div>`:""}${thread!==undefined&&thread!==null?`<div class="card amber case3-dialogue" style="margin-top:16px"><b>${esc(CASE3_QUESTIONS[thread].title)}</b><p style="line-height:1.9">${esc(CASE3_QUESTIONS[thread].beats[beat])}</p>${beat<CASE3_QUESTIONS[thread].beats.length-1?`<button class="btn" onclick="Game.case3Beat()">CONTINUE CONVERSATION →</button>`:`<div class="kicker">HOW DO YOU RESPOND?</div><button class="btn dim" onclick="Game.case3Followup(0)">PRESS THE CONTRADICTION</button><button class="btn dim" onclick="Game.case3Followup(1)">OFFER EMPATHY</button><button class="btn dim" onclick="Game.case3Followup(2)">LET THE SILENCE GROW</button>`}</div>`:`<div style="margin-top:15px">${count<limit?available.slice(0,5).map(q=>`<button class="btn dim" style="margin-top:8px" onclick="Game.case3Ask(${CASE3_QUESTIONS.indexOf(q)})">${esc(q.title)}</button>`).join(''):'<p>The interview window is closed. Elias refuses to answer another question.</p>'}</div>`}${count>=limit&&!f.case3Extra?`<button class="btn" onclick="Game.case3Extra()">SPEND ONE LIFE // FIVE MORE THREADS</button>`:''}<button class="btn dim" style="margin-top:16px" onclick="Game.case3Back()">RETURN TO INVESTIGATION</button>`;}

function t4(){const opts=[['SENSORY','SENSORY DEPRIVATION','MAX CAPACITY RETAINED','Future chambers: illumination reduced. Some environmental detail becomes harder to read.'],['TEMPORAL','TEMPORAL DEGRADATION','MAX CAPACITY RETAINED','Future timed mechanisms will allow less recovery time.'],['ATROPHY','ATROPHY','MAX CAPACITY → 3','No sensory handicap. Maximum capacity is permanently reduced to three.']];return shell(`${header(4,'THE ATROPHY PROTOCOL')}<main class="wrap"><div class="storybox"><p>The door closes behind you. The chair is bolted to the floor; the three switches are not. On the clipboard beside it is your subject number, written twice. One entry is dated before the accident you remember.</p><p class="speaker">“You have solved what I put in front of you,” the Architect says. “Now I need to know what you will give up to keep going.”</p></div><div class="objective"><b>SURVIVAL CONDITION</b>Select one permanent modification. JANUS will remember the choice.</div><div class="col">${opts.map(o=>`<button class="card ${S.flags.pendingProtocol===o[0]?'amber':''}" onclick="Game.pickProtocol('${o[0]}')"><div class="row" style="justify-content:space-between"><b>${o[1]}</b><span class="kicker">${o[2]}</span></div><div class="muted" style="margin-top:8px">${o[3]}</div></button>`).join('')}</div><div class="spacer"></div>${S.protocol?`<div class="card amber center">PROTOCOL LOCKED // ${S.protocol}</div>${solvedButton(4,'YOU WILL CARRY THIS // RETURN')}`:`<button class="btn" onclick="Game.acceptProtocol()">I ACCEPT THIS LOSS</button>`}</main>`)}

   E:`<h3>DOCUMENT E // JANUS INDEX</h3><p>DANIEL VALE — DECEASED<br>ELIAS VALE — WITNESS<br>THIRD INDIVIDUAL — <span class="redact">██████████</span><br>AGE: 17<br>RELATION: SON<br>NAME: <span class="redact">██████████</span></p>`

  else if(ph==='conclusion')body=`<div class="kicker">JANUS // CONCLUSION BUILDER</div><div class="muted" style="margin:9px 0 18px">The evidence may support more than one motive. JANUS is evaluating whether your conclusion is defensible, not whether you guessed the Architect's preferred story.</div><div class="card"><div class="kicker">WHO LIED?</div><div class="answer-grid" style="margin-top:8px">${['ELIAS','NEIGHBOR','DISPATCHER'].map(x=>`<button class="choice-chip ${concl.liar===x?'on':''}" onclick="Game.setConclusion5('liar','${x}')">${x}</button>`).join('')}</div></div><div class="card" style="margin-top:9px"><div class="kicker">WHY?</div><div class="col" style="margin-top:8px">${[['PROTECT','HE WAS PROTECTING HIS SON'],['SELF','HE WAS COVERING HIS OWN INVOLVEMENT'],['PANIC','HE PANICKED AFTER FINDING THE BODY']].map(x=>`<button class="choice-chip ${concl.motive===x[0]?'on':''}" onclick="Game.setConclusion5('motive','${x[0]}')">${x[1]}</button>`).join('')}</div></div><button class="btn" style="margin-top:12px" onclick="Game.submitConclusion5()">SUBMIT ARGUMENT</button>`;

function t10(){let ph=S.flags.t10phase||'tune',freq=S.flags.t10freq||'91.4';let signals={'91.4':'...three... north... static...','94.7':'7294 7294 7294 7294','97.1':'[MUSIC // REVERSED]','101.3':'...SUBJECT THIRTEEN...','103.8':'[TONE] [TONE] [TONE]','106.2':'[BREATHING]','108.6':'BEGIN // D4 A8 F1 B6 E3 C9 // END'};let body='';if(ph==='tune')body=`<div class="storybox"><p>A shortwave receiver occupies the desk. Seven marked frequencies. One authentic transmission.</p></div><div class="objective"><b>SURVIVAL CONDITION</b>An authentic burst is explicitly enclosed by BEGIN and END markers and contains six letter-number channel pairs. Other frequencies contain noise or repeating decoys.</div><select class="input" onchange="Game.tune10(this.value)">${Object.keys(signals).map(f=>`<option ${freq===f?'selected':''}>${f}</option>`).join('')}</select><div class="card amber" style="margin-top:10px;min-height:90px"><div class="kicker">RECEIVER // ${freq} MHz</div><div style="margin-top:14px">${signals[freq]}</div></div><button class="btn" onclick="Game.auth10()">MARK THIS SIGNAL AUTHENTIC</button>`;else if(ph==='order')body=`<div class="card"><div class="kicker">AUTHENTIC BURST</div>D4 &nbsp; A8 &nbsp; F1 &nbsp; B6 &nbsp; E3 &nbsp; C9</div><div class="objective"><b>NEXT CONDITION</b>Order channels alphabetically A–F and enter the six digits.</div><div class="row"><input id="t10six" class="input" inputmode="numeric" maxlength="6" placeholder="_ _ _ _ _ _"><button class="btn" style="width:auto" onclick="Game.order10()">OPEN BOX</button></div>`;else if(ph==='tape')body=`<div class="storybox"><p>The metal box opens. Inside: a cassette labelled <b>PLAY ONCE</b>.</p><p class="speaker">ARCHITECT: “I wouldn't.”</p></div><button class="btn red" onclick="Game.playTape10()">PLAY CASSETTE</button><button class="btn dim" style="margin-top:9px" onclick="Game.skipTape10()">LEAVE IT // INSPECT PROTOCOL</button>`;else if(ph==='missing')body=`<div class="storybox"><p>${S.flags.t10tape?'Your own function t11(){let ph=S.flags.t11phase||'claims';let claims=[['A','SUBJECT 00 NEVER REACHED ANOTHER CHAMBER.','Trial VII records confirm a contact event involving 00.'],['B','YOUR MEMORY WAS SUPPRESSED ONLY ONCE.','Trial IX contains multiple prior attempts and a suppression request.'],['C','THERE ARE NO OTHER ACTIVE SUBJECTS.','Trial VIII established a live peer link with Subject 18.'],['D','DR. VOSS NEVER AUTHORIZED YOUR EXPOSURE.','The recovered intercept places Voss in the authorization chain.'],['E','YOU WERE NEVER PART OF JANUS OPERATIONS.','Trial V/IX evidence links Subject 13 to interviewer/operator history.']];let picks=S.flags.t11picks||[];let body='';if(ph==='claims')body=`<div class="storybox"><p>The room is comfortable. That makes it threatening.</p><p class="speaker">“I believe it's time we spoke properly.”</p></div><div class="objective"><b>SURVIVAL CONDITION</b>Select THREE claims supported by evidence in your Archive. A, B and C can be contradicted by the recovered intercept, memory archive and live peer connection. D and E require additional evidence from your choices.</div>${claims.map(c=>`<button class="card ${picks.includes(c[0])?'amber':''}" style="width:100%;text-align:left;margin:8px 0" onclick="Game.pick11('${c[0]}')"><div class="kicker">CLAIM ${c[0]}</div><b>${c[1]}</b><div class="muted" style="margin-top:7px">${c[2]}</div></button>`).join('')}<button class="btn" onclick="Game.prove11()">PRESENT CONTRADICTIONS // ${picks.length}/3</button>`;else if(ph==='intent')body=`<div class="storybox"><p>Three contradictions remain on the screen.</p><p>The Architect is silent for long enough that you hear the ventilation.</p><p class="speaker">“When that door opens, what are you still trying to do?”</p></div><textarea id="intent11" class="textarea input" placeholder="Answer in your own words."></textarea><button class="btn" onclick="Game.intent11()">ANSWER</button>`;else body=`<div class="card amber">ARCHITECT CONNECTION // LOCAL<br>SOURCE PROFILE // ${S.flags.t11origin?'SUBJECT 13':'INSUFFICIENT AUTHORIZATION'}<br>FINAL INTENT // ${esc(S.flags.finalIntent||'UNKNOWN')}</div>${solvedButton(11,'ENTER DOOR XII')}`;return shell(`${header(11,'CROSS-EXAMINATION')}<main class="wrap">${body}</main>`)}
function t12(){let ph=S.flags.t12phase||'fake';let body='';if(ph==='fake')body=`<div class="white-room"><div class="center"><div class="big">EXIT</div><p style="margin:30px auto;max-width:500px">Sunlight. Wind. Cars somewhere beyond the wall. Birds.</p><p class="muted">After eleven chambers, the simplest thing you have seen feels like the least trustworthy.</p><button class="btn" onclick="Game.fakeExit12()">OPEN EXIT</button></div></div>`;else if(ph==='doors')body=`<div class="storybox"><p>The sunlight dies. Projection glass retracts into the ceiling.</p><p class="speaker">“Congratulations, Thirteen. You may leave.”</p></div><div class="center big">TRIAL XII // CONTINUANCE</div><div class="objective"><b>FINAL CONDITION</b>LEAVE. Twelve doors describe your history. Eleven statements are true. Choose the one that did NOT happen in your playthrough.</div><div class="grid2">${[['I','You spoke MERCY.'],['III',S.flags.t3remember?'You admitted recognition.':'You denied recognition.'],['VI',`You chose ${S.flags.t6door||'LEFT'}.`],['VII',`You ${String(S.flags.t7decision||'HID').startsWith('SHARE')?'shared':'hid'} the intercept.`],['VIII',S.flags.t8order==='HELP_FIRST'?'You helped 18 first.':'You submitted yourself first.'],['IX',S.flags.t9choice==='CONFRONT'?'You confronted him.':'You did not confront him.'],['X',S.flags.t10tape?'You played the cassette.':'You left the cassette unheard.'],['FALSE','Subject 13 entered CONTINUANCE for the first time today.']].map(x=>`<button class="card" onclick="Game.door12('${x[0]}')"><div class="kicker">DOOR ${x[0]}</div>${esc(x[1])}</button>`).join('')}</div>`;else if(ph==='identity')body=`<div class="objective"><b>PHASE II // ESTABLISH IDENTITY</b>Build the chain the records can support.</div><div class="card">SUBJECT 13 → <select id="id12" class="input"><option>JANUS SUBJECT ONLY</option><option>OPERATOR 13</option><option>EXTERNAL OBSERVER</option></select></div><button class="btn" onclick="Game.identity12()">ESTABLISH</button>`;else if(ph==='event')body=`<div class="objective"><b>PHASE III // EVENT 00</b>Put the seven major events in chronological order. Select the sequence that matches the recovered evidence.</div><div class="card"><div>1 JANUS begins unauthorized Continuance test</div><div>2 Subject 00 discovers the behavioural persistence result</div><div>3 Subject 00 escapes their chamber</div><div>4 Subject 00 contacts Operator 13</div><div>5 Operator 13 seals containment</div><div>6 Incident 00 escalates</div><div>7 Subject 13 enters suppression / Continuance</div></div><div class="grid2"><button class="btn dim" onclick="Game.event12('1234567')">1-2-3-4-5-6-7</button><button class="btn dim" onclick="Game.event12('1324567')">1-3-2-4-5-6-7</button><button class="btn dim" onclick="Game.event12('2134567')">2-1-3-4-5-6-7</button><button class="btn dim" onclick="Game.event12('1234657')">1-2-3-4-6-5-7</button></div>`;else if(ph==='final')body=`<div class="storybox"><p>EVENT 00 // RESTORED</p><p class="memory">“CONTINUANCE isn't keeping you inside. It's keeping something else inside with you.”</p></div><div class="objective"><b>FINAL CONDITION</b>No riddle. No correct answer. Do what you came here to do.</div><div class="grid2"><button class="btn" onclick="Game.end12('ESCAPE')">RELEASE SUBJECT 13</button><button class="btn" onclick="Game.end12('ZERO')">RELEASE SUBJECT 00</button><button class="btn red" onclick="Game.end12('TERMINATE')">TERMINATE JANUS</button><button class="btn dim" onclick="Game.end12('CONTINUE')">CONTINUE</button></div>`;else body=`<div class="kicker center">JANUS // FINAL SUBJECT REPORT</div><div class="report" style="margin-top:30px">SUBJECT 13 .............. ${S.flags.ending==='ESCAPE'?'ESCAPED':S.flags.ending==='CONTINUE'?'CONTINUED':'STATUS UNKNOWN'}<br>SUBJECT 00 .............. ${S.flags.ending==='ZERO'?'RELEASED':'UNKNOWN'}<br>JANUS ................... ${S.flags.ending==='TERMINATE'?'TERMINATED':'ACTIVE'}<br>MEMORY .................. ${S.flags.t9choice==='READ'||S.flags.t9choice==='CONFRONT'?'RESTORED / PARTIAL':'PARTIAL'}<br>CONTINUANCE ............. ${S.flags.ending==='TERMINATE'?'COMPROMISED':'ACTIVE'}${S.flags.trial13?'<hr>TRIAL XIII .............. AVAILABLE':''}</div><div class="center big" style="margin-top:35px">CONTINUANCE</div>${S.flags.trial13?'<button class="btn red" style="margin-top:22px" onclick="Game.enter13()">ENTER TRIAL XIII // ZERO</button>':'<button class="btn dim" style="margin-top:22px" onclick="Game.home()">RETURN TO MAIN MENU</button>'}`;return `<div class="screen"><main class="wrap">${body}</main></div>`}
function t13(){let ph=S.flags.t13phase||'passage',body='';
if(ph==='passage')body=`<div class="zero-void"><div class="kicker">UNREGISTERED SPACE // NO CAMERA FEED</div><h1 class="zero-title">ZERO</h1><div class="storybox"><p>The first chamber is waiting for you again.</p><p>Except this time, you remember the sentence.</p><p class="memory">DON’T LET HIM KNOW YOU REMEMBER.</p><p>You press your palm against the west wall. The scratched letters continue beneath a maintenance plate.</p><p>Behind it is a switch JANUS never showed you.</p></div><button class="btn red" onclick="Game.zeroPassage()">REMOVE THE PANEL</button></div>`;
else if(ph==='timeline')body=`<div class="kicker">PROJECT ZERO // RECOVERY SYSTEM</div><div class="big">WHO CAME FIRST?</div><div class="objective"><b>CONDITION 01 // TIMELINE</b>Three archives disagree. Find the impossible chronology.</div><div class="zero-archive"><b>ARCHIVE 00</b><p>21:02 — Participant admitted under pre-designation identity.<br>21:19 — Memory restoration anomaly recorded.<br>21:26 — Designation SUBJECT 00 issued.</p></div><div class="zero-archive"><b>ARCHIVE 13</b><p>20:44 — Operator 13 approves cognitive persistence trial.<br>21:31 — Operator 13 orders containment after contact event.</p></div><div class="zero-archive"><b>ARCHIVE A</b><p>20:58 — ARCHITECT interview transcript references “Subject 00.”<br>22:03 — Architect cognitive instance officially initialized.</p></div><div class="objective"><b>QUESTION</b>Which archive proves that a later identity has been written backward into the record?</div><div class="grid2"><button class="btn dim" onclick="Game.zeroTimeline('00')">ARCHIVE 00</button><button class="btn dim" onclick="Game.zeroTimeline('13')">ARCHIVE 13</button><button class="btn" onclick="Game.zeroTimeline('A')">ARCHIVE A</button></div>`;
else if(ph==='voices')body=`<div class="kicker">PROJECT ZERO // VOICE RECONSTRUCTION</div><div class="objective"><b>CONDITION 02</b>Identify the speakers by what they believe, not by what the archive calls them.</div><div class="transcript"><b>VOICE A:</b> “You cannot keep resetting people until they give you the answer you want.”<br><br><b>VOICE B:</b> “We are not resetting them. We are removing interference.”<br><br><b>VOICE A:</b> “And when they remember?”<br><br><b>VOICE B:</b> “Then we begin again.”</div><div class="grid2"><button class="card" onclick="Game.zeroVoices('13A')"><b>A = LATER 13</b><br><span class="muted">B = EARLY 13 / ARCHITECT SOURCE</span></button><button class="card" onclick="Game.zeroVoices('00A')"><b>A = SUBJECT 00</b><br><span class="muted">B = DR. VOSS</span></button><button class="card" onclick="Game.zeroVoices('ARCHA')"><b>A = ARCHITECT</b><br><span class="muted">B = SUBJECT 13</span></button></div>`;
else if(ph==='reveal')body=`<div class="zero-reveal"><div class="kicker">RECOVERY // 100%</div><h2>THE ARCHITECT IS NOT YOUR JAILER.</h2><p>He is an earlier cognitive snapshot of you — preserved from before you turned against CONTINUANCE.</p><p>Subject 13 became the person who wanted JANUS stopped.</p><p>The Architect remained the person who believed the experiment was necessary.</p><div class="memory">YOU HAVE BEEN ARGUING WITH THE PERSON YOU USED TO BE.</div><button class="btn" onclick="Game.zeroMessage()">OPEN SUBJECT 00 // FINAL MESSAGE</button></div>`;
else if(ph==='question')body=`<div class="storybox"><p class="speaker">SUBJECT 00 // RECOVERED</p><p>“You keep asking how to escape.”</p><p>“That is the wrong question.”</p><p>“Ask what continues.”</p></div><div class="objective"><b>FINAL RECOVERY</b>Answer in your own words. JANUS is no longer grading you.</div><textarea id="zeroAnswer" class="textarea input" placeholder="WHAT CONTINUES?"></textarea><button class="btn" onclick="Game.zeroAnswer()">RECORD ANSWER</button>`;
else if(ph==='choice')body=`<div class="kicker center">MAINTENANCE AUTHORITY // OUTSIDE JANUS</div><div class="big center">NO CONDITION REMAINS.</div><p class="muted center" style="margin:18px auto;max-width:560px">No Architect. No score. No correct answer. The next action belongs to you.</p><div class="grid2"><button class="btn red" onclick="Game.zeroEnd('DELETE')">DELETE CONTINUANCE DATA</button><button class="btn" onclick="Game.zeroEnd('PRESERVE')">PRESERVE CONTINUANCE DATA</button><button class="btn dim" style="grid-column:1/-1" onclick="Game.zeroEnd('WALK')">TOUCH NOTHING // WALK AWAY</button></div>`;
else body=`<div class="zero-ending"><div class="kicker">PROJECT ZERO // CLOSED</div><div class="big">${S.flags.zeroEnding==='DELETE'?'THE MACHINES FALL SILENT':S.flags.zeroEnding==='PRESERVE'?'THE MACHINES CONTINUE HUMMING':'FOR THE FIRST TIME, NOBODY TELLS YOU WHAT HAPPENS NEXT'}</div><p>${S.flags.zeroEnding==='DELETE'?'Behind you, twelve lights go dark. The thirteenth was never connected.':S.flags.zeroEnding==='PRESERVE'?"You tell yourself preservation is not permission. You have told yourself convincing things before.":'You leave the maintenance console untouched and walk toward a door that has no number.'}</p><div class="report">TRIAL XIII .............. SURVIVED<br>SUBJECT 13 .............. UNREGISTERED<br>PROJECT ZERO ............ RECOVERED<br>CONTINUANCE DATA ........ ${S.flags.zeroEnding}</div><div class="continuance-logo">CONTINUANCE</div><button class="btn" onclick="Game.newContinuance()">NEW CONTINUANCE</button><button class="btn dim" style="margin-top:8px" onclick="Game.home()">MAIN MENU</button></div>`;
return `<div class="screen zero-screen"><main class="wrap">${body}</main></div>`}
