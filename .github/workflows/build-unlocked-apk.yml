name: Build unlocked trial QA APK
on:
  push:
    branches:
      - test/all-trials-unlocked-apk
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Java 21
        run: java -version
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Android project and sync playable game
        run: |
          npx cap add android
          npx cap sync android
      - name: Build unsigned debug APK
        working-directory: android
        run: bash ./gradlew assembleDebug --no-daemon
      - name: Upload installable QA APK
        uses: actions/upload-artifact@v4
        with:
          name: Continuance-all-trials-unlocked-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
