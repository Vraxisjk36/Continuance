name: Android playtest build
on:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install
      - name: Continuity smoke tests
        run: node tests/continuity-smoke.cjs
      - name: Generate Android project
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
      - name: Build debug APK for device QA
        working-directory: android
        run: bash ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: continuance-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Build unsigned release AAB
        working-directory: android
        run: bash ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: continuance-unsigned-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
