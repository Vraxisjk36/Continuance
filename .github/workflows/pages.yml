name: Browser preview
# Deploy main game, screenshots, and cinematic preview
# Redeploy requested 2026-11-02: verify all-trials cinematic preview
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify playable source and cinematic preview
        run: |
          test -s www/index.html
          test -s www/cinematic-preview.html
          echo "Preview present in Pages artifact"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
