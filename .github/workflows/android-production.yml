name: Continuance production Android AAB
on:
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify preinstalled Android SDK
        run: |
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          echo "Using Android SDK at $ANDROID_HOME"
      - name: Install dependencies
        run: npm install
      - name: Release smoke and stability gates
        run: |
          node tests/script-syntax.cjs
          node tests/continuity-smoke.cjs
          node tests/closed-test-source-integrity.cjs
          node tests/phase3-character-echoes.cjs
          node tests/phase3-continuity-audit.cjs
          node tests/phase4-save-integrity.cjs
          node tests/phase4-progression-integrity.cjs
          node tests/phase4-ending-resume.cjs
      - name: Assert screenshot override disabled
        run: |
          grep -q 'const SCREENSHOT_MODE_UNLOCK_ALL=false;' www/index.html
      - name: Exclude screenshot-only build from Android package
        run: rm -f www/store-screenshots-2026.html
      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Install native capture protection
        run: python3 scripts/install-android-screen-guard.py
      - name: Generate launcher icons from source artwork
        run: |
          python3 -m pip install --quiet cairosvg pillow
          python3 - <<'PY'
          from pathlib import Path
          import cairosvg,io
          from PIL import Image
          source=Path('assets/continuance-icon.svg').read_bytes()
          root=Path('android/app/src/main/res')
          for density,size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              folder=root/('mipmap-'+density)
              folder.mkdir(parents=True,exist_ok=True)
              raw=cairosvg.svg2png(bytestring=source,output_width=size,output_height=size)
              image=Image.open(io.BytesIO(raw)).convert('RGBA')
              for name in ['ic_launcher.png','ic_launcher_round.png','ic_launcher_foreground.png']:
                  image.save(folder/name)
          for p in root.glob('values*/ic_launcher_background.xml'):
              p.write_text('<resources><color name="ic_launcher_background">#05090e</color></resources>')
          PY
      - name: Configure Play release API, version and signing
        env:
          KEYSTORE_BASE64: ${{ secrets.CONTINUANCE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.CONTINUANCE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CONTINUANCE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CONTINUANCE_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,base64,pathlib
          keys=['KEYSTORE_BASE64','STORE_PASSWORD','KEY_ALIAS','KEY_PASSWORD']
          missing=[k for k in keys if not os.environ.get(k)]
          if missing: raise SystemExit('Missing required GitHub signing secrets: '+', '.join(missing))
          pathlib.Path('android/app/continuance-release.jks').write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64']))
          gradle=pathlib.Path('android/app/build.gradle')
          with gradle.open('a') as f:
              f.write("""
          android {
              compileSdk 36
              defaultConfig {
                  minSdk 24
                  targetSdk 36
                  versionCode 1
                  versionName "1.0.0"
              }
              signingConfigs {
                  continuanceRelease {
                      storeFile file("continuance-release.jks")
                      storePassword System.getenv("STORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.continuanceRelease
                  }
              }
          }
          """)
          PY
      - name: Install Android 16 SDK
        run: |
          set -euo pipefail
          SDKMANAGER=""
          for candidate in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" "$ANDROID_HOME/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager missing; install Android command-line tools on runner"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"
      - name: Build signed Play AAB
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.CONTINUANCE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CONTINUANCE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CONTINUANCE_KEY_PASSWORD }}
        run: bash ./gradlew bundleRelease --no-daemon
      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: continuance-v1.0.0-signed-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
