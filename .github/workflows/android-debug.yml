name: Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Verify web app is present
        run: |
          test -s www/index.html || { echo "::error::Missing www/index.html"; exit 1; }
          echo "Web app found: $(wc -c < www/index.html) bytes"
      - name: Install dependencies
        run: npm install
      - name: Create Android platform
        run: npx cap add android
      - name: Sync web app
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: continuance-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
