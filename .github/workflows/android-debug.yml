name: Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Verify web app is present
        run: |
          test -s www/index.html || { echo "::error::Missing www/index.html"; exit 1; }
          echo "Web app found: $(wc -c < www/index.html) bytes"
      - name: Install dependencies
        run: npm install
      - name: Create Android platform
        run: npx cap add android
      - name: Install native capture protection
        run: python3 scripts/install-android-screen-guard.py
      - name: Sync web app
        run: npx cap sync android
      - name: Generate Continuance launcher icons
        run: |
          python3 -m pip install --quiet cairosvg pillow
          python3 - <<'PY'
          from pathlib import Path
          import io
          import cairosvg
          from PIL import Image
          source=Path('assets/continuance-icon.svg').read_bytes()
          root=Path('android/app/src/main/res')
          for density,size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              folder=root/('mipmap-'+density)
              folder.mkdir(parents=True,exist_ok=True)
              raw=cairosvg.svg2png(bytestring=source,output_width=size,output_height=size)
              icon=Image.open(io.BytesIO(raw)).convert('RGBA')
              for filename in ('ic_launcher.png','ic_launcher_round.png','ic_launcher_foreground.png'):
                  icon.save(folder/filename)
          for path in root.glob('values*/ic_launcher_background.xml'):
              path.write_text('<resources><color name="ic_launcher_background">#05090e</color></resources>')
          PY
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: continuance-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
