name: Continuance release validation
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'www/index.html'
      - 'tests/**'
      - '.github/workflows/android-validation.yml'
  push:
    branches: [main, feature/trial-instance-randomization]
    paths:
      - 'www/index.html'
      - 'tests/**'
      - '.github/workflows/android-validation.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert screenshot mode disabled
        run: grep -q 'const SCREENSHOT_MODE_UNLOCK_ALL=false;' www/index.html
      - name: Run progression, saves, scene and ending checks
        run: |
          node tests/script-syntax.cjs
          node tests/continuity-smoke.cjs
          node tests/ai-resistance-audit.cjs
          node tests/trial1-randomization.cjs
          node tests/trial10-randomization.cjs
          node tests/trial7-exploration.cjs
          node tests/trial8-authentication.cjs
          node tests/trial7-deduction.cjs
          node tests/trial8-exploration.cjs
          node tests/trial9-exploration.cjs
          node tests/trial11-rebuttal.cjs
          node tests/trial12-memory.cjs
