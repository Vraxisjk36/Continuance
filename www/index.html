/* ===== BUILD 2.0 // JANUS COMPLETE ===== */
:root{
  --blood:#4f1512;
  --cold:#6e8790;
}
body{touch-action:manipulation}
body.shock #app{animation:cameraShock .42s cubic-bezier(.2,.8,.2,1)}
body.door-rumble #app{animation:doorRumble .65s linear}
.screen{transition:filter .5s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
.screen::before{
  content:"";position:fixed;inset:-20%;pointer-events:none;z-index:0;
  background:radial-gradient(circle at 50% 42%,transparent 0 22%,rgba(0,0,0,.18) 47%,rgba(0,0,0,.76) 82%);
}
.screen>*{position:relative;z-index:1}
.typewrite{white-space:pre-wrap}
.typewrite.typing::after{content:"▋";margin-left:2px;color:#336e9f;animation:caretBlink .65s steps(1) infinite}
.reveal-after-type{opacity:0;pointer-events:none;transform:translateY(7px);transition:.45s ease}
.reveal-after-type.ready{opacity:1;pointer-events:auto;transform:none}
.storybox{position:relative}
.storybox::before{content:"";position:absolute;left:-14px;top:0;bottom:0;width:1px;background:linear-gradient(transparent,#254259,transparent);opacity:.5}
.storyline{transition:opacity .35s}
.narrative-skip{margin-top:12px;background:none;border:0;color:#3b4954;font-size:8px;letter-spacing:.2em}
.flashlight-stage{
  min-height:64svh;position:relative;overflow:hidden;border:1px solid #1c2328;
  background:
    linear-gradient(180deg,rgba(35,32,28,.6),rgba(8,8,7,.96)),
    repeating-linear-gradient(91deg,transparent 0 38px,rgba(255,255,255,.013) 39px 40px);
  box-shadow:inset 0 0 100px #000;
  --mx:50%;--my:48%;
}
.flashlight-stage::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:15;
  background:radial-gradient(circle 115px at var(--mx) var(--my),
    transparent 0,rgba(0,0,0,.06) 38%,rgba(0,0,0,.67) 69%,rgba(0,0,0,.97) 100%);
}
.flashlight-stage.lowlight::after{
  background:radial-gradient(circle 78px at var(--mx) var(--my),
    transparent 0,rgba(0,0,0,.1) 32%,rgba(0,0,0,.78) 64%,#000 100%);
}
.room-object{position:absolute;z-index:5;border:0;background:transparent;color:#93aec5;padding:0}
.room-object::before{content:"";position:absolute;inset:-16px;border:1px solid transparent;border-radius:50%;transition:.2s}
.room-object:hover::before,.room-object:active::before{border-color:#30526e55;background:#3479b120}
.obj-door{right:8%;top:16%;width:29%;height:62%;border:2px solid #1f1d1a;background:linear-gradient(90deg,#090909,#191714 45%,#080808);box-shadow:inset 0 0 45px #000}
.obj-door::after{content:"";position:absolute;right:13%;top:50%;width:7px;height:7px;border-radius:50%;background:#2f5676;box-shadow:0 0 10px #3670a066}
.obj-drain{left:40%;bottom:8%;width:80px;height:28px;border-radius:50%;background:repeating-linear-gradient(90deg,#171717 0 5px,#030303 5px 9px);transform:perspective(80px) rotateX(55deg);box-shadow:0 12px 26px #000}
.obj-scratch{left:8%;bottom:21%;transform:rotate(-6deg);font-family:Georgia,serif;font-size:13px;color:#6f675d;text-align:left;max-width:170px}
.obj-intercom{left:7%;top:15%;width:72px;height:105px;border:1px solid #1e252a;background:#0a0908;padding:9px}
.obj-intercom i{display:block;height:48px;background:repeating-linear-gradient(0deg,#1a2025 0 2px,transparent 2px 6px)}
.obj-wallmark{left:22%;top:20%;width:26%;height:45%;background:linear-gradient(90deg,transparent,#1d1a17aa,transparent);transform:rotate(1deg)}
.discovery-log{
  position:absolute;z-index:20;left:10px;right:10px;bottom:10px;
  background:#030303df;border-left:2px solid #244a6a;padding:10px 12px;
  font-family:Georgia,serif;font-size:12px;line-height:1.55;color:#96abbc;
  backdrop-filter:blur(8px);animation:rise .22s ease;
}
.investigate-meter{display:flex;gap:5px;margin-top:10px}
.investigate-meter span{width:26px;height:3px;background:#1a2025}
.investigate-meter span.on{background:#3776aa;box-shadow:0 0 8px #255a85}
.cipher-reveal{animation:cipherRise .8s ease both}
.cipher-six{background:linear-gradient(95deg,#13110f,#060708);padding:14px;border:1px solid #1d2429;box-shadow:inset 0 0 60px #000}
.cipher-line{position:relative;padding-left:10px;border-left:1px solid #1f262c}
.cipher-line:nth-child(4){filter:contrast(.85);text-shadow:3px 0 6px #3e0b08}
.workbench{position:relative;overflow:hidden}
.workbench::after{content:"EVIDENCE IS NOT INSTRUCTION";position:absolute;right:-32px;bottom:12px;transform:rotate(-8deg);font-size:8px;letter-spacing:.22em;color:#1c354a}
.intercom button{position:relative;overflow:hidden}
.intercom button::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#1b496e22,transparent);transform:translateX(-110%)}
.intercom button:active::after{animation:sweep .7s linear}
.corridor-scene{
  min-height:100svh;padding:82px 14px 110px;
  background:
   linear-gradient(90deg,#020202 0 7%,transparent 15% 85%,#020202 93%),
   radial-gradient(ellipse at 50% 15%,#11212e 0,#06090c 25%,#020202 74%);
}
.corridor-ceiling{height:40px;margin:-24px auto 16px;max-width:680px;background:linear-gradient(#060708,#0b1115,#030405);clip-path:polygon(8% 0,92% 0,100% 100%,0 100%);opacity:.85}
.corridor-depth{max-width:640px;margin:auto;display:grid;gap:18px;perspective:900px}
.corridor-door{
  min-height:118px;position:relative;width:100%;border:1px solid #1d242a;
  background:linear-gradient(90deg,#050505 0 6%,#0f1316 6% 94%,#050505 94%);
  box-shadow:inset 0 0 55px #000,0 18px 35px #0009;
  color:#86a2b9;text-align:left;padding:0;overflow:hidden;transform-origin:top center;
}
.corridor-door:nth-child(n+5){transform:scale(.985)}
.corridor-door.locked{filter:brightness(.45);pointer-events:none}
.corridor-door.completed{filter:brightness(.55)}
.corridor-door .door-slab{position:absolute;inset:8px 13%;border:1px solid #222a30;background:linear-gradient(100deg,#090909,#0e1215 50%,#050505)}
.corridor-door .door-copy{position:relative;z-index:4;display:flex;justify-content:space-between;align-items:center;min-height:116px;padding:20px}
.chain-lines{position:absolute;inset:0;z-index:3;pointer-events:none}
.chain-lines::before,.chain-lines::after{content:"";position:absolute;left:-10%;right:-10%;height:5px;background:repeating-linear-gradient(90deg,#171717 0 16px,#333f49 16px 21px);box-shadow:0 2px 4px #000}
.chain-lines::before{top:37%;transform:rotate(6deg)}
.chain-lines::after{top:62%;transform:rotate(-5deg)}
.door-number{font-family:Arial Black,sans-serif;font-size:28px;color:#263a4a}
.door-amber{width:8px;height:8px;border-radius:50%;background:#4790cb;box-shadow:0 0 18px #4790cb;animation:pulse 1.4s infinite}
.corridor-graffiti{font-family:Georgia,serif;font-style:italic;color:#465a6b;font-size:15px;transform:rotate(-2deg);margin:20px 8px 28px}
.arrival-door-stage{max-width:520px;margin:auto;perspective:900px}
.arrival-door{
  position:relative;height:54svh;min-height:360px;border:1px solid #202930;
  background:linear-gradient(110deg,#070707,#101417 48%,#050505);
  box-shadow:inset 0 0 80px #000,0 0 60px #000;
  transform-origin:left center;transition:transform 1.4s cubic-bezier(.25,.8,.15,1),filter .7s;
}
.arrival-door.opening{transform:rotateY(-78deg);filter:brightness(.4)}
.arrival-door .plate{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);text-align:center}
.arrival-door .plate strong{display:block;font-family:Arial Black,sans-serif;font-size:42px;color:#2b3d4b}
.arrival-door .plate span{font-size:8px;letter-spacing:.28em;color:#406380}
.arrival-copy{margin-top:18px;font-family:Georgia,serif;font-size:15px;line-height:1.75;color:#9bafc0}
.hold-btn{position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
.hold-btn .holdfill{position:absolute;inset:0 auto 0 0;width:0;background:#24517524;pointer-events:none}
.hold-btn.holding .holdfill{animation:holdFill 1.35s linear forwards}
.hold-btn span{position:relative;z-index:2}
.photo{transition:transform .25s,filter .25s,box-shadow .25s;touch-action:none}
.photo:hover,.photo:active{transform:scale(1.025) rotate(-.5deg);z-index:8;box-shadow:0 14px 30px #000}
.item{position:relative;transition:.2s}
.item:active{transform:translateY(-3px) rotate(-1deg);border-color:#345875}
.item::after{content:"INSPECT";position:absolute;right:8px;top:8px;font-size:7px;letter-spacing:.18em;color:#34414b}
.vault{position:relative;animation:vaultBreath 5s ease-in-out infinite}
.vault::before{content:"";position:absolute;inset:15%;border:1px dashed #213545;border-radius:50%;animation:spinSlow 16s linear infinite}
.panel{transition:.15s;box-shadow:inset 0 0 25px #000}
.panel:active{transform:scale(.94)}
.packet .card{transition:.2s}
.packet .card:active{transform:translateX(3px)}
.signature{transition:.25s;position:relative;overflow:hidden}
.signature.on::after{content:"";position:absolute;inset:-20%;background:radial-gradient(circle,#275c8744,transparent 60%);animation:pulse 1s infinite}
.white-room{position:relative;background:linear-gradient(#eef1f4,#dddcd6);overflow:hidden}
.white-room::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 40%,transparent 0 30%,#c8c6be55 100%)}
.archive-grid{display:grid;gap:10px;margin-top:18px}
.evidence-card{border:1px solid #212930;background:#060708;padding:14px;position:relative}
.evidence-card::before{content:"FILE";position:absolute;right:8px;top:8px;color:#2f3b45;font-size:7px;letter-spacing:.2em}
.screen-crack{position:fixed;z-index:55;pointer-events:none;opacity:0}
[data-screen^="trial7"] .screen-crack,[data-screen^="trial8"] .screen-crack{opacity:.18}
[data-screen^="trial9"] .screen-crack,[data-screen^="trial10"] .screen-crack{opacity:.3}
[data-screen^="trial11"] .screen-crack{opacity:.48}

.t1-ui .t1-direction span{color:#738b9e;font-variant-numeric:tabular-nums}
.t1-ui .t1-reveal{animation:t1-arrive .4s ease-out both;border-left:3px solid #5089b8}
.t1-ui .room-object:focus-visible,.t1-ui button:focus-visible{outline:2px solid #7ab2e0;outline-offset:3px}
@keyframes t1-arrive{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.t1-ui .t1-opening,.t1-ui .t1-reveal{animation:none!important}}
.t1-ui .t1-keygrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:16px 0}.t1-ui .t1-keygrid label{display:flex;align-items:center;justify-content:space-between;gap:5px;border:1px solid #2c4457;padding:7px;color:#7db2dd}.t1-ui .t1-keygrid select{width:55px;min-width:0;background:#0d1216;color:#abcbe5;padding:6px;border:1px solid #2c4960}.t1-ui .t1-second{margin-top:28px}.t1-ui .t1-reorder{display:grid;gap:9px;margin:18px 0}.t1-ui .t1-verse{display:flex;align-items:center;gap:10px;padding:12px;background:#0d1317;border:1px solid #25394a}.t1-ui .t1-verse p{flex:1;margin:0;line-height:1.5}.t1-ui .t1-verse div{display:grid;gap:5px}.t1-ui .t1-verse button{width:38px;height:32px;background:#14222e;border:1px solid #304f68}.t1-ui .t1-verse button:disabled{opacity:.25}.t1-ui .t1-ending{padding:18px;margin-top:20px;background:#101b24;border:1px solid #40749e}@media(min-width:600px){.t1-ui .t1-keygrid{grid-template-columns:repeat(6,minmax(0,1fr))}}.t1t2-scene{min-height:100svh;max-width:600px;margin:auto;padding:70px 24px 45px;display:flex;flex-direction:column;justify-content:center;gap:30px;background:radial-gradient(ellipse at bottom,#10232b 0%,transparent 55%)}.t1t2-copy{font-size:clamp(18px,4.5vw,24px);line-height:1.85;color:#d4dee6;animation:sceneFade .5s ease both}.t1t2-progress{display:flex;gap:9px}.t1t2-progress span{height:3px;flex:1;background:#303c46}.t1t2-progress span.on{background:#739ec2}@media(prefers-reduced-motion:reduce){.t1t2-copy{animation:none}}.t2-chamber .t2-intro{padding:14px 0 18px}.t2-chamber .t2-intro h2{letter-spacing:.11em}.t2-chamber .t2-controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:18px 0}.t2-chamber .t2-control{min-height:116px;padding:13px 11px;text-align:left;background:rgba(11,24,31,.88);border:1px solid #395260;border-radius:5px;color:#d8e9ef;display:flex;flex-direction:column;gap:8px;position:relative;z-index:2}.t2-chamber .t2-control.seen{border-color:#83b8c6;background:rgba(18,44,55,.94)}.t2-chamber .t2-controlnum{font-size:10px;color:#8eb7c5}.t2-chamber .t2-control b{font-size:12px;letter-spacing:.07em}.t2-chamber .t2-control>span:last-child{font-size:11px;line-height:1.6;color:#bbd0d7}.t2-chamber .t2-logic{padding:13px;background:rgba(6,15,20,.9);border:1px solid #395260;position:relative;z-index:2;margin:15px 0}.t2-chamber .t2-logic p{font-size:12px;line-height:1.8}.t2-chamber .t2-progress{font-size:11px;letter-spacing:.1em;color:#9cc9d6}@media(min-width:620px){.t2-chamber .t2-controls{grid-template-columns:repeat(3,minmax(0,1fr))}}
/* JANUS cinematic interaction pass — restrained, diegetic, mobile-first */
:root{--janus-paper:#c4ced6;--janus-metal:#82919a;--janus-rust:#507492;--janus-ease:cubic-bezier(.22,.8,.2,1)}
button{touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #7fa2bf;outline-offset:3px}
.btn,.story-action,.t2-control,.case3-location,.room-object{transition:background-color .22s ease,border-color .22s ease,transform .22s var(--janus-ease),box-shadow .22s ease}
.btn:active,.story-action:active,.t2-control:active,.case3-location:active{transform:translateY(2px) scale(.995)}
.screen.prologue{background:radial-gradient(ellipse at 25% 75%,#1d211f 0%,#0c0f0e 44%,#030404 100%)}
.screen.prologue:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 47%,rgba(146,172,193,.05) 49%,transparent 51%);animation:janusLight 12s ease-in-out infinite}
.prologue .storybox{position:relative;border-left:2px solid #596e7f;box-shadow:-16px 0 55px rgba(0,0,0,.3)}
.t1t2-scene{position:relative;isolation:isolate;overflow:hidden}
.t1t2-scene:before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(160deg,rgba(139,151,146,.06),transparent 43%),repeating-linear-gradient(90deg,transparent 0 79px,rgba(190,196,188,.025) 80px 81px);animation:janusCorridor 1.2s var(--janus-ease) both}
.t1t2-scene .kicker{color:#9ca69d}
.t1t2-scene .btn{margin-top:12px;min-height:52px;background:#191c1b;border-color:#62675d}
.t1t2-copy{max-width:48ch;text-wrap:pretty;animation:janusSceneEnter .7s var(--janus-ease) both}
.t1t2-progress span{transition:background .35s ease}
.t2-chamber{background:linear-gradient(180deg,rgba(13,28,32,.4),transparent 400px)}
.t2-chamber .water-room{box-shadow:inset 0 0 0 1px rgba(105,140,151,.2),0 16px 45px rgba(0,0,0,.25)}
.t2-chamber .t2-control{overflow:hidden}
.t2-chamber .t2-control:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(120deg,transparent 40%,rgba(175,214,223,.05) 50%,transparent 60%);transform:translateX(-100%);transition:transform .6s var(--janus-ease)}
.t2-chamber .t2-control:active:before{transform:translateX(100%)}
.t2-chamber .t2-control.seen{box-shadow:inset 3px 0 0 #799da8}
.t2-chamber .t2-secret{border-left:2px solid #80a0bb;padding-left:12px;color:#abc6dc}
.case3-detail{animation:janusSceneEnter .4s var(--janus-ease) both}
.case3-location[aria-current="location"]{box-shadow:inset 3px 0 0 #7d99b0}
body[data-screen="trial4"] .storybox{border-left:2px solid #738a9d}
body[data-screen="trial4"] .card{transition:border-color .2s,background-color .2s,transform .2s}
body[data-screen="trial4"] .card:active{transform:translateY(2px)}
@keyframes janusSceneEnter{from{opacity:0;transform:translateY(12px);filter:blur(2px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
@keyframes janusCorridor{from{opacity:0;transform:scale(1.035)}to{opacity:1;transform:scale(1)}}
@keyframes janusLight{0%,88%,100%{opacity:.45}90%{opacity:.08}91%{opacity:.45}94%{opacity:.1}95%{opacity:.45}}
@media(max-width:400px){.t2-chamber .t2-controls{gap:7px}.t2-chamber .t2-control{padding:11px 9px;min-height:108px}.t1t2-scene{padding-left:19px;padding-right:19px}}
@media(prefers-reduced-motion:reduce){.screen.prologue:before,.t1t2-scene:before,.t1t2-copy,.case3-detail{animation:none!important}.btn,.story-action,.t2-control,.case3-location,.room-object{transition:none!important}}
.t1-crib{border:1px solid #35434f;border-left:3px solid #6385a0;background:linear-gradient(120deg,rgba(60,75,88,.2),rgba(10,10,9,.7));padding:15px;margin:16px 0 20px}.t1-crib p{font-size:12px;line-height:1.7}.t1-crib-key{display:grid;gap:4px;width:max-content;max-width:100%;text-align:center;margin:15px auto;color:#a5bdd1;letter-spacing:.42em;font-size:21px}.t1-crib-key span:nth-child(2){font-size:12px;color:#968d7d}.t1-crib-key strong{color:#a9cdeb;font-size:20px}.t1-keygrid select:disabled{color:#93bee2;opacity:1;border-color:#446178;background:#192025;cursor:default}
/* Unified JANUS cinematic direction */
.janus-cinema{min-height:100svh;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#050708;padding:clamp(28px,6vh,70px) 22px}
.cinema-atmosphere{position:absolute;inset:0;pointer-events:none;overflow:hidden;background:radial-gradient(ellipse at 55% 35%,#202725 0,#0c1112 40%,#020404 82%)}
.cinema-atmosphere:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 4px,rgba(210,218,206,.012) 5px 6px);opacity:.45}
.cinema-door{position:absolute;right:-12%;top:9%;width:48%;height:90%;border-left:5px solid rgba(112,131,127,.16);background:linear-gradient(90deg,rgba(19,28,27,.8),rgba(0,0,0,.65));box-shadow:-25px 0 80px rgba(0,0,0,.6);transform:skewY(-2deg)}
.cinema-light{position:absolute;top:-22%;left:22%;width:48%;height:115%;background:linear-gradient(180deg,rgba(190,206,190,.16),transparent 78%);filter:blur(34px);transform:rotate(-22deg);transform-origin:top;animation:cinemaSway 9s ease-in-out infinite alternate}
.cinema-content{width:min(100%,530px);position:relative;z-index:1;animation:janusSceneEnter .6s ease both}
.cinema-top{display:flex;justify-content:space-between;gap:14px;color:#a7a99e;font:10px/1.5 ui-monospace,monospace;letter-spacing:.16em;border-bottom:1px solid rgba(185,191,173,.22);padding-bottom:16px}
.cinema-title{font:500 clamp(21px,5.5vw,32px)/1.2 Georgia,serif;letter-spacing:.035em;color:#d8dfe4;margin:32px 0 0;text-wrap:balance}
.cinema-story{font:clamp(16px,4.1vw,19px)/1.85 Georgia,serif;color:#d5dce1;white-space:pre-line;min-height:130px;max-width:45ch;margin:34px 0 28px;text-wrap:pretty;text-shadow:0 1px 15px #000}
.cinema-actions{display:flex;flex-direction:column;gap:12px}
.cinema-next,.cinema-choices button{width:100%;min-height:58px;padding:15px 18px;text-align:left;display:flex;align-items:center;justify-content:space-between;background:rgba(191,199,179,.1);border:1px solid rgba(194,202,185,.45);color:#dfe4e9;font:11px/1.5 ui-monospace,monospace;letter-spacing:.15em}
.cinema-next span{font-size:20px}.cinema-next:active,.cinema-choices button:active{background:rgba(191,199,179,.23)}
.cinema-skip{background:transparent;border:0;color:#858c84;font:10px ui-monospace,monospace;letter-spacing:.12em;align-self:center;padding:12px;min-height:42px}
.cinema-track{display:flex;gap:5px;margin-top:22px}.cinema-track i{display:block;flex:1;height:2px;background:#4b514c}.cinema-track i.active{background:#b5c1cb}
.cinema-choices{display:grid;gap:10px;margin:20px 0}.cinema-choices button{line-height:1.7}
.janus-splash{display:flex;align-items:center;justify-content:center;background:#010203;isolation:isolate;overflow:hidden}
.splash-haze{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 47%,rgba(109,126,116,.14),transparent 54%);opacity:0;animation:splashHaze 5.5s ease forwards}
.splash-beam{position:absolute;inset:-35%;z-index:0;background:conic-gradient(from 160deg at 50% 50%,transparent 0deg,transparent 37deg,rgba(210,221,230,.01) 42deg,rgba(225,232,208,.28) 52deg,rgba(210,221,230,.015) 63deg,transparent 73deg,transparent 360deg);filter:blur(22px);transform:translateX(-55%) rotate(-30deg);animation:splashSweep 5.8s cubic-bezier(.25,.55,.2,1) forwards}
.splash-sequence{text-align:center;width:100%;padding:22px;position:relative;z-index:2}
.splash-studio{color:#c6d0d8;font:14px/1.5 Georgia,serif;letter-spacing:.08em;opacity:0;animation:studioReveal 2.5s ease .8s forwards}.splash-studio strong{font-weight:600;letter-spacing:.025em}
.splash-line{width:45px;height:1px;background:#8b978e;margin:27px auto;opacity:0;animation:studioReveal 1s ease 2.7s forwards}
.splash-game{font:600 clamp(29px,8vw,57px)/1.1 Georgia,serif;letter-spacing:clamp(.08em,1.2vw,.18em);color:#dde3e7;text-shadow:0 0 36px rgba(201,218,194,.25);opacity:0;transform:translateY(9px);animation:gameReveal 2s ease 3s forwards;overflow-wrap:anywhere}
.splash-sub{color:#919b91;font:9px/1.8 ui-monospace,monospace;letter-spacing:.17em;margin-top:23px;opacity:0;animation:studioReveal 1.6s ease 4.2s forwards}
.splash-enter{position:absolute;z-index:3;bottom:max(8vh,45px);left:50%;transform:translateX(-50%);min-width:160px;min-height:48px;background:transparent;border:1px solid #5d6a61;color:#d7dfd2;font:11px ui-monospace,monospace;letter-spacing:.24em;opacity:0;animation:studioReveal 1s ease 5.1s forwards}
.splash-enter span{margin-left:12px}
@keyframes splashSweep{0%{transform:translateX(-65%) rotate(-30deg);opacity:0}18%{opacity:1}78%{opacity:1}100%{transform:translateX(52%) rotate(17deg);opacity:.3}}
@keyframes splashHaze{0%,20%{opacity:0}70%,100%{opacity:1}}
@keyframes studioReveal{to{opacity:1}}
@keyframes gameReveal{to{opacity:1;transform:translateY(0)}}
@keyframes cinemaSway{to{transform:rotate(-15deg) translateX(12px)}}
@media(max-width:420px){.janus-cinema{padding:28px 24px}.cinema-story{margin:28px 0 24px;min-height:120px}.cinema-title{margin-top:25px}}
@media(prefers-reduced-motion:reduce){.splash-haze,.splash-beam,.splash-studio,.splash-line,.splash-game,.splash-sub,.splash-enter,.cinema-light,.cinema-content{animation:none!important;opacity:1!important;transform:none!important}}

/* Main menu / chamber directory / transition loading */
.janus-main-menu{background:#040606;position:relative;display:flex;align-items:center;justify-content:center;overflow-x:hidden;isolation:isolate;padding:20px}
.menu-facility{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 68% 32%,#17242e 0%,#0a0e11 37%,#030405 77%)}

.menu-door-frame{position:absolute;right:-12%;top:6%;width:55%;height:93%;border:8px solid rgba(99,111,101,.19);box-shadow:inset 22px 0 70px #000, -20px 0 90px #000;background:linear-gradient(110deg,#0d1413,#030504);transform:skewY(-3deg)}

.menu-panel{position:relative;z-index:1;width:min(100%,500px);padding:30px 12px 24px}

.menu-brand p{font:10px/1.7 ui-monospace,monospace;letter-spacing:.11em;color:#809fb8;margin-top:15px}
.menu-status{display:flex;align-items:center;gap:12px;border-top:1px solid #2f475a;border-bottom:1px solid #2f475a;padding:16px 0;margin-bottom:20px}

.menu-status strong,.menu-status small{display:block;font:10px/1.6 ui-monospace,monospace;letter-spacing:.08em;color:#b4cee4}
.menu-status small{font-size:9px;color:#6d89a0;margin-top:4px}
.menu-commands{display:grid;gap:10px}
.menu-command{min-height:66px;width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;padding:13px 17px;border:1px solid #2e4354;background:rgba(5,10,8,.83);color:#b4cee4;font:11px ui-monospace,monospace;letter-spacing:.09em}

.menu-command small{display:block;font-size:9px;letter-spacing:.07em;margin-top:6px;opacity:.7}
.menu-command b{font-size:21px;font-weight:400}

.menu-utilities{display:flex;justify-content:space-between;gap:9px;margin-top:23px}
.menu-utilities button{border:0;border-bottom:1px solid #2f475a;background:transparent;color:#84a6c1;padding:10px 3px;font:10px ui-monospace,monospace;letter-spacing:.12em}
.menu-foot{margin-top:38px;color:#5d7d97;font:9px ui-monospace,monospace;letter-spacing:.11em}
.janus-directory{min-height:100svh;background:linear-gradient(160deg,#0c141a,#050708 45%,#070a0d);padding:24px max(20px,calc((100vw - 640px)/2));color:#c4dbed}
.directory-header{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #2e4354;padding:8px 0 20px;font:9px ui-monospace,monospace;letter-spacing:.1em;color:#809fb8}
.directory-back{background:transparent;border:0;color:#c4dbed;font:11px ui-monospace,monospace;padding:8px 0}
.directory-heading{margin:40px 0 22px}.directory-heading h1{font:500 clamp(26px,7vw,38px) Georgia,serif;letter-spacing:.03em;margin:12px 0}.directory-heading p{font:14px/1.7 Georgia,serif;color:#adb8ad;max-width:40ch}
.directory-progress{font:10px ui-monospace,monospace;color:#9abad4;letter-spacing:.12em;margin-bottom:22px}.directory-progress>div{height:3px;background:#1b2b38;margin-top:10px}.directory-progress i{display:block;height:100%;background:#639ece}
.directory-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.directory-mark{position:absolute;right:15px;top:14px;font-size:19px;color:#72a6d1}

@media(max-width:360px){.directory-grid{gap:8px}.directory-door{padding:11px;min-height:116px}.menu-brand h1{font-size:28px}}

function architectExtended(q){
const normalized=String(q||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const match=ARCHITECT_TOPICS.find(([rx])=>rx.test(normalized));
if(!match)return null;
const [rx,replies]=match;
const history=(S.intercomLog||[]).filter(x=>x.role==='YOU'&&rx.test(x.text)).length;
const seed=normalized.split('').reduce((a,c)=>a+c.charCodeAt(0),0)+history;
profileAdd('curiosity');
return replies[seed%replies.length]+((history>2&&history%4===0)?' You have returned to this subject before.':'');
}

  let cipher=ready?`<div class="cipher-reveal"><div class="kicker">INSCRIPTION // TASK 1 OF 2</div><h2>DECODE THE VERSES</h2><p class="muted">Every symbol stands for one letter. Repeated symbols represent the same letter. Decode all six lines.</p><div class="t1-crib"><div class="kicker">A NOTE SCRATCHED BELOW THE INSCRIPTION</div><p>Someone has written three letters beneath the first repeating word. The pencil marks are faint but deliberate.</p><div class="t1-crib-key"><span>⊙ ♤ ☆</span><span>↓ ↓ ↓</span><strong>T H E</strong></div><p class="muted">These three letters are confirmed. Use them to work out the rest of the alphabet.</p></div><div class="wall"><div class="cipher-six">${lines.map((line,i)=>`<div class="cipher-line"><span class="t1-line-number">${i+1}.</span> ${line.split(' ').map((word,j)=>{let solved=(S.flags.t1words||{})[i+'-'+j];return `<button class="t1-word ${solved?'decoded':''}" onclick="Game.t1OpenWord(${i},${j})" aria-label="Decode word ${j+1} in line ${i+1}">${solved?esc(solved):esc(word)}</button>`}).join(' ')}</div>`).join('')}</div></div><div class="workbench t1-word-workbench"><div class="kicker">YOUR DECODING WORKSPACE</div><p class="muted">Tap any symbol word above. Type what you think it says. Correct words stay decoded; incorrect guesses return to symbols. Your progress is saved.</p><div class="t1-word-progress">${Object.keys(S.flags.t1words||{}).length} / ${lines.reduce((n,line)=>n+line.split(' ').length,0)} WORDS DECODED</div><div class="t1-symbol-panel"><div class="kicker">SYMBOL DECODER // REFERENCE KEY</div><p class="muted">Keep track of what each symbol might mean. Guesses are saved and help you decode words above. The key does not reveal answers.</p><div class="t1-keygrid">${[...new Set(lines.join('').split('').filter(ch=>T1_GLYPHS.includes(ch)))].map(g=>`<label>${g}<select aria-label="Letter for ${g}" ${['⊙','♤','☆'].includes(g)?'disabled':''} onchange="Game.t1Map('${g}',this.value)"><option value="">?</option>${T1_ALPHABET.split('').map(ch=>`<option value="${ch}" ${((S.flags.t1map||{})[g]||({'⊙':'T','♤':'H','☆':'E'})[g])===ch?'selected':''}>${ch}</option>`).join('')}</select></label>`).join('')}</div><div class="t1-symbol-legend">⊙ = T &nbsp; ♤ = H &nbsp; ☆ = E <span>CONFIRMED CLUES</span></div></div>${S.flags.t1activeWord?(()=>{let [li,wi]=S.flags.t1activeWord.split('-').map(Number),word=lines[li]?.split(' ')[wi];return word?`<div class="t1-word-editor"><div class="kicker">DECODING // LINE ${li+1} · WORD ${wi+1}</div><div class="t1-word-target">${esc(word)}</div><input id="t1wordguess" class="input" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="40" placeholder="TYPE THE WORD" onkeydown="if(event.key==='Enter')Game.t1SubmitWord()"><div class="t1-word-actions"><button class="btn" onclick="Game.t1SubmitWord()">CONFIRM WORD</button><button class="btn dim" onclick="Game.t1CloseWord()">CANCEL</button></div>${S.flags.t1wordFeedback?`<p class="t1-word-error">${esc(S.flags.t1wordFeedback)}</p>`:''}</div>`:''})():''}</div>${S.flags.t1decoded?`<div class="t1-second"><div class="kicker">INSCRIPTION // TASK 2 OF 2</div><h2>RECONSTRUCT THE POEM</h2><p class="muted">Pair the rhymes and follow the meaning. Rearrange the six lines.</p><div class="t1-reorder">${order.map((v,i)=>`<div class="t1-verse"><span>${i+1}</span><p>${esc(T1_VERSES[v])}</p><div><button ${i===0?'disabled':''} onclick="Game.t1Move(${i},-1)" aria-label="Move line up">↑</button><button ${i===5?'disabled':''} onclick="Game.t1Move(${i},1)" aria-label="Move line down">↓</button></div></div>`).join('')}</div><button class="btn" onclick="Game.t1CheckOrder()">VERIFY POEM</button>${S.flags.t1ordered?`<div class="t1-ending"><p>The final word has been erased.</p><p>The speaker asks: “Five letters. What do the guilty beg from those who can punish them?”</p><div class="row"><input id="a1" class="input" placeholder="FINAL WORD"><button class="btn" style="width:auto" onclick="Game.answer1()">SPEAK</button></div></div>`:''}</div>`:''}${solvedButton(1,'THE LOCK IS TURNING')}</div>`:'';
  return shell(`<div class="t1-ui">${header(1,'THE INSCRIPTION')}<main class="wrap">${inspect}${cipher}</main></div>`);
}

function t2(){
let f=S.flags,exam=f.t2exam||[],found=id=>exam.includes(id),solved=S.completed.includes(2);
const info=[['intake','INTAKE MANIFOLD','The first valve is stamped 7. Its arrow points to the FILTER. A scratched note: START WHERE THE WATER ENTERS.'],['filter','FILTER HOUSING','Stamped 2. The filter feeds the PRESSURE REGULATOR, never the drain.'],['regulator','PRESSURE REGULATOR','Stamped 9. A brass arrow points from the regulator to the BYPASS.'],['bypass','BYPASS CONTROL','Stamped 4. The bypass redirects flow to the RESERVOIR.'],['reservoir','RESERVOIR GAUGE','Stamped 1. An engraved line runs from the reservoir to the RELEASE VALVE. A folded corner of paper protrudes behind the gauge. Inspect again to retrieve it.'],['release','RELEASE VALVE','Stamped 8. Its outlet leads to the FINAL DRAIN.'],['drain','FINAL DRAIN','Stamped 3. A warning: THIS MUST BE THE LAST CONTROL.']];
return shell(`${header(2,'HIGH WATER')}<main class="wrap t2-chamber"><div class="t2-intro"><div class="kicker">JANUS // CHAMBER 02</div><h2>THE SYSTEM OBEYS.</h2><p>The door locks behind you. Cold water spreads across your ankles. Seven controls sit behind a protective grille. A keypad blinks above them. Scratched into the glass is a height mark and a date. Beside it, in smaller writing: I THOUGHT HE WOULD OPEN IT FOR HER.</p><p class="speaker">“The water is following a route. Learn it, or drown inside it.” A pause. “Someone once asked me to stop the test. I could not tell whether they were asking for themselves.”</p></div>
<div class="water-room"><div id="waterFill" class="water-fill"></div><div class="water-content"><div class="row" style="justify-content:space-between"><div class="kicker">HYDRAULIC SYSTEM</div><div id="waterStatus" class="water-status">ANKLE HEIGHT</div></div><p class="muted">Inspect each component to trace the direction of flow. Seven stamped digits form the exit code in the same order.</p><div class="t2-controls">${info.map(([id,title,body],i)=>`<button class="t2-control ${found(id)?'seen':''}" onclick="Game.t2Inspect('${id}')"><span class="t2-controlnum">${String(i+1).padStart(2,'0')}</span><b>${title}</b><span>${found(id)?body:'TAP TO INSPECT'}</span></button>`).join('')}</div><div class="t2-logic"><div class="kicker">CONTROL SEQUENCE</div><p>Start at the intake. Follow each physical connection. The final drain must be last. Record the seven stamped digits in order.</p><div class="t2-progress">${exam.length} / 7 COMPONENTS INSPECTED</div>${f.t2record?`<p class="t2-secret">${esc(f.t2recordNote)}</p>`:''}</div><input id="a2new" class="input code-seven" inputmode="numeric" maxlength="7" autocomplete="off" placeholder="_ _ _ _ _ _ _"><button class="btn" style="margin-top:10px" onclick="Game.answerHighWater()">SUBMIT SEQUENCE</button></div></div>${solved?solvedButton(2,'CONTINUE'):''}</main>`)}
function witnessNotebook(){let notes=S.flags.t3personalNotes||'',entries=(S.evidence||[]).filter(e=>String(e.id||'').startsWith('t3-'));return `<div class="card amber" style="margin-top:18px"><div class="kicker">PERSONAL CASE JOURNAL // SUBJECT 13</div><p class="muted">Your private deductions are never marked right or wrong. Saved locally on this device.</p><textarea id="witnessPersonalNotes" class="textarea input" rows="7" maxlength="10000" placeholder="Timeline, contradictions, suspects, possible cause of death…" oninput="Game.saveWitnessNotes(this.value)">${esc(notes)}</textarea><div class="kicker" style="margin-top:16px">RECORDED CASE MATERIAL</div>${entries.length?entries.map(e=>`<div style="padding:10px 0;border-bottom:1px solid #4a3a27"><b>${esc(e.title)}</b><p class="muted">${esc(e.text)}</p></div>`).join(''):'<p class="muted">No official evidence filed yet. Examine the room and question witnesses.</p>'}</div>`}

const CASE3=[
{title:'THE INFIRMARY',lead:'The hospital corridor ends at a cot beneath a fluorescent lamp. A woman lies under a sheet. Her identity bracelet reads DR. MARA VOSS. The Architect does not say why you have been brought here.',tasks:[
['EXAMINE THE BODY','A deep injury mars the back of Voss’s skull. The sheet is clean near her shoulders, despite dried blood in her hair. The body was found here; the injury may have happened elsewhere.'],
['CHECK THE CLOTHING','Coolant has soaked into the soles of her shoes. A rectangular pale mark circles her wrist where a watch once sat.'],
['READ THE DISCOVERY LOG','An orderly logged the body at 22:46. This is the discovery time, not necessarily the time of death.']]},
{title:'GENERATOR ROOM',lead:'The door sticks against a warped metal floor strip. Something heavy has been dragged away. An overhead pipe knocks three times, although the machinery is silent.',tasks:[

['SEARCH THE LATCH','A torn white coat cuff is trapped inside the service hatch. Its seam is hand-repaired with blue thread.']]},
{title:'LAUNDRY PASSAGE',lead:'A trolley wheel squeals somewhere beyond the locked gate. When you look through the glass, the passage is empty.',tasks:[

['EXAMINE THE BLOOD TRAIL','The blood forms interrupted transfer streaks, not a large pool. Someone or something bleeding travelled through this passage.'],
['OPEN THE SERVICE REGISTER','A medical trolley was checked out under security override EV-04 at 22:23. The return signature is missing.']]},
{title:'SECURITY ARCHIVE',lead:'Six monitors glow. One displays an empty generator room. Another displays the same room with a woman standing in it. Their clocks disagree.',tasks:[
['ALIGN THE CLOCKS','A generator alarm at 22:18 appears at 22:21 on the infirmary feed. The infirmary camera runs three minutes fast.'],
['RECOVER DOOR CONTACTS','Voss entered the generator room at 22:12. Elias Vale’s override opened it at 22:16. No other badge entered before the alarm at 22:18.'],
['RESTORE THE TRANSFER CLIP','At corrected time 22:24, a figure wearing a security coat pushes a covered trolley toward the infirmary. The face is obscured.']]},
{title:'MEDICAL RECORDS',lead:'A sealed examination terminal asks for a record number. Beneath the screen someone has scratched: THE CLOCKS ARE NOT THE BODY.',tasks:[
['READ THE INJURY ASSESSMENT','The examiner describes a heavy blow delivered from behind. The injury pattern matches a blunt metal edge, not a fall onto a flat surface.'],
['COMPARE THE ESTIMATES','The estimated death window is 22:17–22:19. The generator emergency alarm sounded at 22:18. The two records narrow the likely minute.'],
['INSPECT THE HANDS','There are no injuries suggesting that Voss delivered the fatal blow herself. The report cannot identify an attacker on its own.']]},
{title:'THE SECOND REPORT',lead:'An investigation report sits on a desk that was empty when you arrived. The handwriting resembles yours. The date is tomorrow. A page is missing.',tasks:[

['EXAMINE THE SIGNATURE','The initials are S-13. A thumbprint stains the paper, but the scanner refuses to identify its owner.'],
['LISTEN TO THE FINAL RECORDING','Voss says: “Elias, put that down. We can still report it.” A metallic impact follows. The audio has no picture; it is evidence, not a confession.']]}
];
const CASE3_QUESTIONS=[
{title:'Where were you when the generator alarm sounded?',req:[],beats:['Elias keeps his hands flat on the table. “In security. Where I was supposed to be.”','You ask whether anyone saw him. He looks toward the dark observation window. “The cameras would have.”','The overhead speaker hums. Elias adds, too quickly, “Assuming they were working.”'],next:['Why would the cameras not be working?','Who else was on duty?','What did you hear from the generator room?','When did you first see Voss?','Who controls the security records?']},
{title:'Your override opened the generator room at 22:16.',req:['3:1'],beats:['Elias stops moving his thumb. “Someone borrowed my badge.”','You point out that the log includes his personal override. His chair creaks as he leans away.','“Those codes are shared,” he says. Then, after a pause: “Sometimes.”'],next:['Who knew your override?','Why did you not report a missing badge?','Were you protecting someone?','Why did the alarm sound two minutes later?','What happened to the camera footage?']},
{title:'Why does the missing camera footage begin when Voss arrived?',req:['3:0'],beats:['His eyes move to the recorder. “Maintenance. We have outages all the time.”','You ask why the door sensors survived the outage. His mouth opens, but he says nothing.','“You have already decided what happened,” he says softly. The recorder captures a sharp breath.'],next:['Who ordered maintenance?','Why did you omit the outage?','What can the backup logs show?','Who had access to the camera controls?','What are you afraid I will find?']},
{title:'Explain the torn cuff found in the generator hatch.',req:['1:2'],beats:['Elias instinctively covers his right wrist. “I tore it fixing a door.”','You mention the blue repair thread. His gaze falls to the cuff he is wearing now.','“My mother repaired that coat,” he says. For a moment his anger seems genuine. “She is dead. Is that what you wanted?”'],next:['Which door were you fixing?','Why did you leave the fabric behind?','Did you touch the broken gauge?','When did you last see Voss alive?','Why did you conceal this from security?']},
{title:'Why was your override used to move a medical trolley?',req:['2:2'],beats:['Elias shakes his head before you finish speaking. “I moved supplies. Nothing more.”','You ask why the trolley travelled from the generator room toward the infirmary. He stares at a stain on the table.','“People need help in this place,” he says. “Sometimes you move them because no one else will.”'],next:['Who needed help?','Was Voss on that trolley?','Why was the return log unsigned?','Who told you to move it?','Were you trying to save her?']},
{title:'Voss can be heard telling you to put something down.',req:['5:2'],beats:['Elias turns pale. “That recording is incomplete.”','You say nothing. He fills the silence himself: “She was going to ruin everything.”','A click comes from the observation glass. Elias whispers, “You should ask who made me do it.”'],next:['What was she going to expose?','Who gave you the order?','What were you holding?','Why did you move the body?','What did the Architect promise you?']}
];
const CASE3_SCENES=["An emergency light flickers. Behind the wall, someone whispers a name, then falls silent.","The generator is cold. Footsteps retreat behind the service hatch.","A trolley squeaks in the distance, but the passage is empty.","The security feed rewinds three seconds on its own. An empty chair is briefly occupied.","The terminal flashes PATIENT: SUBJECT 13, then corrects itself to VOSS, MARA.","At the foot of tomorrow's report, in your handwriting: I thought finding the killer would be enough."];
const CASE3_REACTIONS=["The Architect: The body was found here. That does not mean she died here.","The Architect: A weapon tells you how. A person tells you why.","The Architect: Concealment and rescue can leave the same tracks.","The Architect: Compare the clocks before trusting either one.","The Architect: A narrow window is not the same thing as certainty.","The Architect: You have not written this report. Yet."];
const CASE3_WITNESSES=[{"title":"ORDERLY // NINA REYES","lead":"Nina stands by the infirmary door, holding a clipboard hard enough to bend it. She was the first person to find Mara Voss.","req":[],"beats":["“I found her at 22:46. I didn't say she died then.” Nina glances toward the corridor.","You ask why she called security before a physician. “Because the trolley was still wet. Someone had just brought her here.”","Her voice catches. “I knew Mara. She was going to tell us what JANUS had done. Please don't let the file call this an accident.”"]},{"title":"MAINTENANCE // JONAH REED","lead":"Jonah smells of coolant. He keeps rubbing grease from a thumb that is already clean.","req":["1:1"],"beats":["“The gauge was loose, but it couldn't fall by itself. Someone had to pull the retaining pin.”","You ask who had access. “Security did. Maintenance did. But only one override opened the door after Mara entered.”","He stares at the floor. “There was a scream when the alarm sounded. After that, wheels. A trolley, heading toward the infirmary.”"]},{"title":"ARCHIVE OPERATOR // LENA CROSS","lead":"Lena speaks through a terminal. Her face is obscured by compression artifacts; the connection may be recorded.","req":["3:0"],"beats":["“Our infirmary camera was three minutes fast. The generator alarm was logged on the central clock.”","You ask why the video disappeared. “It wasn't a power failure. Someone deleted the frames, but forgot the door contacts.”","A second voice enters her channel: “Lena, disconnect.” She whispers, “If the file changes again, keep your own notes.”"]}];
function case3Evidence(id,title,text){S.evidence=S.evidence||[];if(!S.evidence.some(e=>e.id===id))S.evidence.push({id,title,text})}
function t3(){
let f=S.flags,room=Math.min(5,Math.max(0,f.case3room||0)),found=f.case3found||[],phase=f.case3phase||'arrival',body='';
if(S.completed.includes(3)){body=`<div class="card amber"><h2>CASE FILE SEALED</h2><p>The observation glass has gone dark. The Architect never tells you whether the witness was telling the truth.</p></div>${solvedButton(3,'LEAVE THE HOSPITAL')}`;}
else if(phase==='arrival'){body=`<div class="storybox" style="line-height:1.9"><p>The third door opens into a hospital corridor. A woman is crying somewhere beyond the lights. You turn back. The door is gone.</p><p>The overhead speaker crackles. “You have spent two trials trying to get out. Now I want to know what you do when someone else cannot.”</p><p>On a wristband hanging from a door: DR. MARA VOSS // DECEASED // 22:46.</p><p>“The last investigator never finished,” the Architect says. “Perhaps you will.”</p><p>At the far end of the corridor, a security monitor lights up. Its screen shows you standing exactly where you are.</p></div><button class="btn" onclick="Game.case3Start()">ENTER THE INVESTIGATION</button>`;}
else if(phase==='investigate'){let x=CASE3[room];body=`<div class="case3-topline"><div class="kicker">CHAMBER III // INVESTIGATION</div><div class="case3-progress">${found.length} / 18 CLUES</div></div><h2>${esc(x.title)}</h2><div class="storybox"><p>${esc(x.lead)}</p><p>${esc(CASE3_SCENES[room])}</p></div><div class="objective"><b>CASE OBJECTIVE</b>Inspect the scene. Evidence is recorded without verification. You may revisit any scene later.</div><div class="case3-locations">${CASE3.map((r,i)=>`<button class="case3-location" aria-current="${i===room?'location':'false'}" onclick="Game.case3Room(${i})">${i+1}. ${esc(r.title)}<small>${r.tasks.filter((_,j)=>found.includes(i+':'+j)).length} / 3 OBSERVED</small></button>`).join('')}</div><div style="margin-top:18px">${x.tasks.map((task,i)=>`<button class="btn ${found.includes(room+':'+i)?'dim':''}" style="margin-top:8px" onclick="Game.case3Inspect(${i})">${esc(task[0])} ${found.includes(room+':'+i)?'// RECORDED':''}</button>`).join('')}</div>${f.case3Detail!==undefined&&f.case3Detail!==null?`<div class="card amber case3-detail" style="margin-top:15px"><div class="kicker">OBSERVATION LOG</div><p style="line-height:1.85">${esc(x.tasks[f.case3Detail][1])}</p><p class="muted">${esc(CASE3_REACTIONS[room])}</p></div>`:''}<button class="btn" style="margin-top:20px" onclick="Game.case3Interrogate()">INTERROGATE ELIAS VALE</button><button class="btn dim" onclick="Game.case3WitnessList()">INTERVIEW OTHER WITNESSES</button><button class="btn dim" onclick="Game.case3Report()">PREPARE FINAL CASE REPORT</button>`;}
else if(phase==='witnesses'){body=`<div class="kicker">CASE 03 // WITNESS CONTACTS</div><h2>THREE VOICES, THREE VERSIONS</h2><div class="storybox"><p>The Architect opens three remote channels. “Witnesses are not proof, Thirteen. They are people who remember.”</p></div>${CASE3_WITNESSES.map((w,i)=>`<button class="btn dim" style="margin-top:10px" onclick="Game.case3Witness(${i})">${esc(w.title)} ${((f.case3WitnessDone||[]).includes(i))?'// RECORDED':w.req.every(x=>found.includes(x))?'// AVAILABLE':'// REQUIRES EVIDENCE'}</button>`).join('')}<button class="btn dim" onclick="Game.case3Back()">RETURN TO SCENE</button>`;}
else if(phase==='witness'){let i=f.case3WitnessIndex||0,w=CASE3_WITNESSES[i],beat=f.case3WitnessBeat||0;body=`<div class="kicker">REMOTE TESTIMONY // ${esc(w.title)}</div><div class="storybox"><p>${esc(w.lead)}</p></div><div class="card amber case3-dialogue"><p style="line-height:1.9">${esc(w.beats[beat])}</p></div><button class="btn" onclick="Game.case3WitnessNext()">${beat===w.beats.length-1?'CLOSE TESTIMONY':'CONTINUE CONVERSATION'}</button><button class="btn dim" onclick="Game.case3WitnessList()">RETURN TO CONTACTS</button>`;}
else if(phase==='interrogate'){let count=f.case3Questions||0,limit=f.case3Extra?10:5,thread=f.case3Thread,beat=f.case3Beat||0,available=CASE3_QUESTIONS.filter(q=>q.req.every(r=>found.includes(r))&&!(f.case3Asked||[]).includes(CASE3_QUESTIONS.indexOf(q)));body=`<div class="kicker">INTERROGATION // ELIAS VALE</div><h2>THE MAN BEHIND THE GLASS</h2><div class="storybox"><p>Elias sits beneath a single lamp. He has been told that you are a prisoner, not a detective. He keeps glancing at the camera.</p></div><div class="muted">INTERROGATION THREADS USED: ${count} / ${limit}</div>${f.case3LastResponse?`<div class="storybox"><p>${esc(f.case3LastResponse)}</p></div>`:""}${thread!==undefined&&thread!==null?`<div class="card amber case3-dialogue" style="margin-top:16px"><b>${esc(CASE3_QUESTIONS[thread].title)}</b><p style="line-height:1.9">${esc(CASE3_QUESTIONS[thread].beats[beat])}</p>${beat<CASE3_QUESTIONS[thread].beats.length-1?`<button class="btn" onclick="Game.case3Beat()">CONTINUE CONVERSATION →</button>`:`<div class="kicker">HOW DO YOU RESPOND?</div><button class="btn dim" onclick="Game.case3Followup(0)">PRESS THE CONTRADICTION</button><button class="btn dim" onclick="Game.case3Followup(1)">OFFER EMPATHY</button><button class="btn dim" onclick="Game.case3Followup(2)">LET THE SILENCE GROW</button>`}</div>`:`<div style="margin-top:15px">${count<limit?available.slice(0,5).map(q=>`<button class="btn dim" style="margin-top:8px" onclick="Game.case3Ask(${CASE3_QUESTIONS.indexOf(q)})">${esc(q.title)}</button>`).join(''):'<p>The interview window is closed. Elias refuses to answer another question.</p>'}</div>`}${count>=limit&&!f.case3Extra?`<button class="btn" onclick="Game.case3Extra()">SPEND ONE LIFE // FIVE MORE THREADS</button>`:''}<button class="btn dim" style="margin-top:16px" onclick="Game.case3Back()">RETURN TO INVESTIGATION</button>`;}
else if(phase==='report'){let choices=(name,options)=>`<label style="display:block;margin-top:16px">${name}<select id="case3_${name.split(' ')[0]}" class="input" style="display:block;width:100%;margin-top:6px"><option value="">SELECT A FINDING</option>${options.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select></label>`;body=`<div class="kicker">FINAL RECONSTRUCTION</div><h2>THE DEATH OF DR. MARA VOSS</h2><div class="storybox"><p>The Architect cuts the lights outside the room. “Submit your theory. If you are mistaken, I will not tell you where.”</p></div><div class="objective">One incorrect finding costs one life. The report is evaluated as a whole. You may return to the investigation and reconsider every clue.</div>${choices('Cause of death',[['blunt','Blunt-force head trauma'],['poison','Poisoning'],['fall','Accidental fall'],['asphyxia','Asphyxiation']])}${choices('Time of death',[['2212','22:12'],['2218','22:18'],['2224','22:24'],['2240','22:40']])}${choices('Location of death',[['infirmary','Infirmary'],['generator','Generator room'],['laundry','Laundry passage'],['security','Security office']])}${choices('Manner of death',[['murder','Murder'],['suicide','Suicide']])}${choices('Killer identity',[['elias','Elias Vale'],['technician','Maintenance technician'],['architect','The Architect'],['unknown','Unknown intruder'],['none','Not applicable // suicide']])}<button class="btn" style="margin-top:20px" onclick="Game.case3Submit()">SEAL CASE REPORT</button><button class="btn dim" onclick="Game.case3Back()">REOPEN INVESTIGATION</button><p class="muted">Reports rejected: ${f.case3Failures||0}. No individual finding will be confirmed.</p>`;}
return shell(`<div class="case3-ui">${header(3,'THE WITNESS')}<main class="wrap"><div class="case3-stage">${body}</div><button class="btn dim case3-journal" style="margin-top:20px" onclick="Game.toggleWitnessNotebook()">◫ ${S.flags.t3notebookOpen?'CLOSE':'OPEN'} PERSONAL CASE JOURNAL</button>${S.flags.t3notebookOpen?witnessNotebook():''}</main></div>`);
}

else if(ph==='tape')body=`<div class="storybox"><p>A cabinet opens. Inside: a cassette labelled <b>PLAY ONCE</b>. Beneath it is a handwritten instruction: <i>There are two versions of this recording. Ask who chose the one you are hearing.</i></p><p class="speaker">ARCHITECT: “I wouldn't play that. I cannot guarantee what they left intact.”</p></div><button class="btn red" onclick="Game.playTape10()">PLAY THE CASSETTE</button><button class="btn dim" onclick="Game.skipTape10()">PRESERVE THE TAPE UNHEARD</button>`;
else if(ph==='missing')body=`<div class="storybox"><p>${f.t10tape?'Your voice, younger and frightened: “The code is not what you heard. It is what they removed.” The tape ends before you can hear who you were speaking to.':'You put the tape down. The silence feels like a choice, not an absence.'}</p><p>Four recovered witnesses appear on the terminal. Each describes a different part of the missing emergency channel.</p></div><div class="t10-witnesses">${T10_WITNESS.map((w,i)=>`<button class="t10-witness ${(f.t10witnesses||[]).includes(i)?'read':''}" onclick="Game.t10ReadWitness(${i})"><small>${w.time} / ${(f.t10witnesses||[]).includes(i)?'EXAMINED':'SEALED'}</small><strong>${w.who}</strong>${f.t10active===i?`<p>${w.text}</p><em>${(f.t10witnesses||[]).includes(i)?w.detail:''}</em>`:''}</button>`).join('')}</div>${(f.t10witnesses||[]).length>=4?`<div class="t10-decision"><div class="kicker">WHAT IS THE EMERGENCY CHANNEL FOR?</div><p>Four records, one disputed purpose. Choose the explanation the evidence supports.</p><div class="grid2"><button class="btn dim" onclick="Game.t10Interpret('LOCK')">A MACHINE LOCK CHECKSUM</button><button class="btn dim" onclick="Game.t10Interpret('HUMAN')">A HUMAN AUTHORIZATION</button><button class="btn dim" onclick="Game.t10Interpret('DECOY')">A DECOY TO MISLEAD YOU</button></div></div>`:'<p class="muted">Review all four testimonies before deciding what the missing channel means.</p>'}`;
else if(ph==='transmit')body=`<div class="storybox"><p>The archive marks your interpretation as supported: <b>HUMAN AUTHORIZATION</b>.</p><p>The emergency channel was assigned the digit <b>5</b>. The name of the person who authorized it has been removed. The number will open the door; it will not absolve whoever chose to use it.</p><p class="speaker">“I was there,” says the Architect. “That is the part they did not erase.”</p></div><div class="objective"><b>FINAL CONDITION</b>Append emergency channel G=5 to the reconstructed six-channel transmission. The transmission records your choice to continue.</div><div class="row"><input id="t10final" class="input" inputmode="numeric" maxlength="7" placeholder="SEVEN DIGITS"><button class="btn" style="width:auto" onclick="Game.finish10()">TRANSMIT</button></div>`;
else body=`<div class="storybox"><p>The signal dies. Before the speaker goes silent, you hear the Architect say, very quietly, “I should have opened it.”</p><p>He does not explain which door.</p></div>${solvedButton(10)}`;
return shell(`${header(10,'DEAD AIR')}<main class="wrap t10-new">${body}</main>`)}
const T11_RECORDS=[
['JANUS CHARTER','The Board authorizes controlled behavioural simulations. It prohibits physical exposure. The authorization is signed before Incident 00.','BOARD','The original charter cannot justify the physical chambers.'],
['THE FIRST BREACH','Subject 00 discovers a persistence result and moves beyond the assigned chamber. Operations flags an unplanned contact with Operator 13.','00','A contact event exists; the claim that 00 never reached another chamber is false.'],
['CONTAINMENT ORDER','Operator 13 seals a containment boundary. The stated reason is protection. The record does not identify who was left on the other side.','13','A signature proves an action, not its motive.'],
['SUPPRESSION CONSENT','The first memory suppression carries a consent request. Subsequent cycles carry administrative renewals, not fresh consent.','ARCHIVE','Agreement once does not establish agreement forever.'],
['PRESENT EXPOSURE','Ren / Subject 18 is connected to a physical terminal. The current experiment is not confined to a simulated environment.','LIVE','The claim that no other subjects remain active is false.'],
['THE MISSING CHANNEL','Emergency channel G records a human authorization; its numerical value survives, but the authorizer name was removed.','G','The archive proves a decision was made, not who made it.']
];
function t11(){let ph=S.flags.t11phase||'claims',f=S.flags,seen=f.t11records||[],picks=f.t11picks||[],claims=[
['A','SUBJECT 00 NEVER REACHED ANOTHER CHAMBER.','FIRST BREACH / OPERATIONS CONTACT'],
['B','YOUR MEMORY WAS SUPPRESSED ONLY ONCE.','SUPPRESSION CONSENT / REPEATED CYCLES'],
['C','THERE ARE NO OTHER ACTIVE SUBJECTS.','PRESENT EXPOSURE / REN'],
['D','DR. VOSS NEVER AUTHORIZED YOUR EXPOSURE.','E. VOSS APPEARS IN THE AUTHORIZATION CHAIN; SCOPE UNVERIFIED'],
['E','YOU WERE NEVER PART OF JANUS OPERATIONS.','OPERATOR 13 APPEARS ON A CONTAINMENT ORDER']
];let body='';
if(ph==='claims')body=`<div class="storybox"><p>Two cups wait on the table. One is warm. The observation glass is uncovered. Behind it, a chair stands empty.</p><p>“I told them the rooms would hurt people,” the Architect says. “They asked me for a probability. I gave them one. They called it acceptable.”</p><p>You ask why he kept running the trials.</p><p>“Because after Incident 00, I believed opening the wrong door could hurt more people. I still do not know if I was right.”</p></div><div class="objective"><b>CROSS-EXAMINATION / EVIDENCE FIRST</b>Review the six records. Then select three claims you can actually contradict. Some accusations are plausible but not fully proven.</div><div class="t11-records">${T11_RECORDS.map((r,i)=>`<button class="t11-record ${seen.includes(i)?'read':''}" onclick="Game.t11ReadRecord(${i})"><small>FILE ${String(i+1).padStart(2,'0')} / ${r[2]} / ${seen.includes(i)?'EXAMINED':'SEALED'}</small><strong>${r[0]}</strong>${f.t11active===i?`<p>${r[1]}</p><em>${r[3]}</em>`:''}</button>`).join('')}</div>${seen.length>=6?`<div class="t11-claims"><h3>CHALLENGE THE ARCHITECT</h3>${claims.map(c=>`<button class="t11-claim ${picks.includes(c[0])?'chosen':''}" onclick="Game.pick11('${c[0]}')"><small>CLAIM ${c[0]}</small><strong>${c[1]}</strong><span>${c[2]}</span></button>`).join('')}<button class="btn" onclick="Game.prove11()">PRESENT THREE CONTRADICTIONS / ${picks.length}/3</button></div>`:'<p class="muted">Read every record before making an accusation. The archive is not infallible.</p>'}`;
else if(ph==='reckoning')body=`<div class="storybox"><p>The three disputed statements remain on the glass. The Architect does not deny them.</p><p>“I edited the reports,” he says. “I told myself I was protecting the subjects from conclusions the evidence could not support. Eventually I stopped asking whether they were conclusions or facts.”</p><p>You ask who ordered the memory suppression.</p><p>“The first request was yours. The renewals were not.”</p><p>For once, he does not follow the answer with a question.</p></div><div class="objective"><b>THE RECKONING</b>The Architect admits altering reports. His reason is still disputed. Decide how you respond; this will be recorded in your final testimony.</div><div class="grid2"><button class="btn dim" onclick="Game.t11Reckon('ACCOUNTABILITY')">YOU DON'T GET TO CALL THAT PROTECTION</button><button class="btn dim" onclick="Game.t11Reckon('EVIDENCE')">SHOW ME WHO SIGNED THE RENEWALS</button><button class="btn dim" onclick="Game.t11Reckon('MERCY')">I BELIEVE YOU WERE AFRAID. THAT DOESN'T EXCUSE IT.</button></div>`;
else if(ph==='intent')body=`<div class="storybox"><p>${f.t11reckoning==='ACCOUNTABILITY'?'“You are right,” he says. “I used the word protection because it made the consequences easier to count.”':f.t11reckoning==='EVIDENCE'?'He displays a signature field: ADMINISTRATIVE RENEWAL / AUTHORITY REDACTED. “I can prove the renewals occurred. I cannot prove whose hand approved them.”':'“I was afraid,” he says. “Thank you for not confusing that with innocence.”'}</p><p>${f.t8order==='HELP_FIRST'?'Four taps come through the wall. Ren is still answering.':'A small light marked SUBJECT 18 stays on. You cannot tell if Ren can hear you.'}</p><p>“When the last door opens,” he asks, “what will you do with what you know?”</p></div><textarea id="intent11" class="textarea input" placeholder="Your answer, in your own words."></textarea><button class="btn" onclick="Game.intent11()">RECORD YOUR ANSWER</button>`;
else body=`<div class="storybox"><p>The Architect turns off his microphone. You hear the switch move; there is no automated announcement.</p><p>The two cups remain on the table. You leave yours untouched.</p></div><div class="card amber">ARCHIVE CONTRADICTIONS // ${(f.t11picks||[]).join(', ')}<br>RESPONSE // ${esc(f.t11reckoning||'UNKNOWN')}<br>FINAL INTENT // ${esc(f.finalIntent||'UNKNOWN')}</div>${solvedButton(11,'ENTER DOOR XII')}`;
return shell(`${header(11,'THE RECKONING')}<main class="wrap">${body}</main>`)}
const T12_ENDINGS={ESCAPE:['THE DOOR YOU CHOSE','The outer lock releases. The corridor beyond smells of wet asphalt, not disinfectant.','The system remains active. Your exit cannot prove anyone else was freed.','You step into real rain.'],ZERO:['THE DOOR YOU OPENED','The containment seal releases. Somewhere deeper, a second alarm answers the first.','The archive names Subject 00 as the beneficiary. It cannot prove what opening the seal will do.','A voice on an old intercom whispers: Thirteen?'],TERMINATE:['THE MACHINE GOES QUIET','The monitors go dark, one chamber at a time.','The system stops reporting on the people inside. You cannot know which doors opened and which lost power.','The Architect says: I should have told you what terminate meant.'],CONTINUE:['ONE MORE RECORD','You refuse the exit and ask the system to preserve its unanswered evidence.','You remain inside a mechanism that has already taken memories from you. This time, you know the risk.','The Architect places a file on the table. On its cover: ZERO.']};
const JANUS_CHRONOLOGY=[
['01','THE CHARTER','The Board approves twelve behavioural simulations. Physical exposure is excluded.','AUTHORIZED'],
['02','THE PERSISTENCE RESULT','Subject 00 identifies a result the original protocol cannot contain.','RECORDED'],
['03','THE BREACH','Subject 00 leaves the assigned chamber and contacts Operator 13.','RECORDED'],
['04','THE SEAL','Operator 13 seals a containment boundary. The justification reads PROTECTION; the other side is unidentified.','ACTION VERIFIED / MOTIVE UNKNOWN'],
['05','INCIDENT 00','The containment event escalates. The surviving reports disagree about its consequences.','DISPUTED'],
['06','THE FIRST SUPPRESSION','Subject 13 requests a memory suppression. Later renewals lack fresh consent.','INITIAL REQUEST VERIFIED'],
['07','CONTINUANCE','The system repeats its trials. Subject 18 remains active; physical exposure exceeds the original charter.','PRESENT']
];
function t12(){let ph=S.flags.t12phase||'fake';let body='';if(ph==='fake')body=`<div class="white-room"><div class="center"><div class="big">EXIT</div><p style="margin:30px auto;max-width:500px">Sunlight. Wind. Cars somewhere beyond the wall. Birds. ${S.flags.t8trust>=3?'A familiar four-tap rhythm comes from the other side of the door. Ren may have reached this place too.':S.flags.t8lied?'There is no sound from the other chamber. You remember the last thing Ren said after your false code.':'The wind carries a faint mechanical click, like a microphone switching on.'}</p><p class="muted">After eleven chambers, the simplest thing you have seen feels like the least trustworthy.</p><button class="btn" onclick="Game.fakeExit12()">OPEN EXIT</button></div></div>`;else if(ph==='doors')body=`<div class="storybox"><p>The sunlight dies. Projection glass retracts into the ceiling.</p><p class="speaker">“Congratulations, Thirteen. You may leave.”</p></div><div class="center big">TRIAL XII // CONTINUANCE</div><div class="objective"><b>FINAL CONDITION</b>LEAVE. Twelve doors describe your history. Eleven statements are true. Choose the one that did NOT happen in your playthrough.</div><div class="grid2">${[['I','You spoke MERCY.'],['III',S.flags.t3remember?'You admitted recognition.':'You denied recognition.'],['VI',`You chose ${S.flags.t6door||'LEFT'}.`],['VII',`You ${String(S.flags.t7decision||'HID').startsWith('SHARE')?'shared':'hid'} the intercept.`],['VIII',S.flags.t8order==='HELP_FIRST'?'You helped 18 first.':'You submitted yourself first.'],['IX',S.flags.t9choice==='CONFRONT'?'You confronted him.':'You did not confront him.'],['X',S.flags.t10tape?'You played the cassette.':'You left the cassette unheard.'],['FALSE','Subject 13 entered CONTINUANCE for the first time today.']].map(x=>`<button class="card" onclick="Game.door12('${x[0]}')"><div class="kicker">DOOR ${x[0]}</div>${esc(x[1])}</button>`).join('')}</div>`;else if(ph==='identity')body=`<div class="objective"><b>PHASE II // ESTABLISH IDENTITY</b>Build the chain the records can support.</div><div class="card">SUBJECT 13 → <select id="id12" class="input"><option>JANUS SUBJECT ONLY</option><option>OPERATOR 13</option><option>EXTERNAL OBSERVER</option></select></div><button class="btn" onclick="Game.identity12()">ESTABLISH</button>`;else if(ph==='event')body=`<div class="objective"><b>PHASE III // INCIDENT 00</b>Review the chronology. It establishes what happened, but not whether the containment seal was justified. Identify the one conclusion the records cannot prove.</div><div class="t12-chronology">${JANUS_CHRONOLOGY.map(r=>`<div class="t12-chron"><small>${r[0]} / ${r[3]}</small><strong>${r[1]}</strong><p>${r[2]}</p></div>`).join("")}</div><div class="t12-question"><div class="kicker">WHICH CLAIM GOES BEYOND THE EVIDENCE?</div><button class="btn dim" onclick="Game.event12('A')">SUBJECT 00 CONTACTED OPERATOR 13</button><button class="btn dim" onclick="Game.event12('B')">OPERATOR 13 SEALED CONTAINMENT TO SAVE EVERYONE</button><button class="btn dim" onclick="Game.event12('C')">LATER SUPPRESSIONS LACKED FRESH CONSENT</button></div>`;else if(ph==='final')body=`<div class="storybox"><p>EVENT 00 // RESTORED</p><p class="memory">“CONTINUANCE isn't keeping you inside. It's keeping something else inside with you.”</p></div><div class="t12-account"><div class="kicker">YOUR RECORD / WHAT THE SYSTEM COULD NOT ERASE</div><p><b>CHAMBER IV:</b> ${esc(S.protocol||S.flags.t4choice||"UNKNOWN")} — the sacrifice followed you.</p><p><b>CHAMBER VI:</b> ${S.flags.t6door==="LEFT"?"You chose silence and an edited interview.":"You chose darkness and surviving access logs."}</p><p><b>REN:</b> ${S.flags.t8order==="HELP_FIRST"?"You gave Ren the code first.":"You opened your own door first."} ${S.flags.t8lied?"Ren knows you lied.":S.flags.t8fourTaps?"You learned the four taps mean I AM HERE.":""}</p><p><b>THE ARCHITECT:</b> ${S.flags.t11reckoning==="ACCOUNTABILITY"?"You demanded accountability.":S.flags.t11reckoning==="EVIDENCE"?"You demanded the missing authorization.":S.flags.t11reckoning==="MERCY"?"You recognized fear without excusing harm.":"You challenged his account."}</p><p><b>UNRESOLVED:</b> Someone authorized emergency channel G. The name was removed. Operator 13 sealed containment; the records do not prove why.</p></div><div class="objective"><b>FINAL CONDITION</b>Choose what you will do with what remains unknown. None of these doors promises everyone survives.</div><div class="grid2"><button class="btn" onclick="Game.end12('ESCAPE')">RELEASE SUBJECT 13</button><button class="btn" onclick="Game.end12('ZERO')">RELEASE SUBJECT 00</button><button class="btn red" onclick="Game.end12('TERMINATE')">TERMINATE JANUS</button><button class="btn dim" onclick="Game.end12('CONTINUE')">CONTINUE</button></div>`;else if(ph==="aftermath"){let e=T12_ENDINGS[S.flags.ending]||T12_ENDINGS.ESCAPE;body=`<div class="t12-aftermath"><div class="kicker">FINAL TRANSMISSION / ${S.flags.ending}</div><h2>${e[0]}</h2><p>${e[1]}</p><p>${e[2]}</p><p>${S.flags.t8order==="HELP_FIRST"?"Four taps sound from beyond the wall. You cannot see Ren, but you know the rhythm.":S.flags.t8lied?"You listen for four taps and hear nothing. You cannot know whether Ren has chosen not to answer.":"You remember Ren, who wanted somebody outside to remember their name."}</p><p>${S.flags.t11reckoning==="ACCOUNTABILITY"?"You remember telling the Architect that calling something protection does not make it so.":S.flags.t11reckoning==="MERCY"?"The Architect does not ask for forgiveness.":"The erased signature is still missing."}</p><p class="t12-last">${e[3]}</p></div><button class="btn" onclick="Game.t12ViewReport()">READ THE FINAL SUBJECT REPORT</button>`;}else body=`<div class="kicker center">JANUS // FINAL SUBJECT REPORT</div><div class="report" style="margin-top:30px">SUBJECT 13 .............. ${S.flags.ending==='ESCAPE'?'ESCAPED':S.flags.ending==='CONTINUE'?'CONTINUED':'STATUS UNKNOWN'}<br>SUBJECT 00 .............. ${S.flags.ending==='ZERO'?'RELEASED':'UNKNOWN'}<br>JANUS ................... ${S.flags.ending==='TERMINATE'?'TERMINATED':'ACTIVE'}<br>MEMORY .................. ${S.flags.t9choice==='READ'||S.flags.t9choice==='CONFRONT'?'RESTORED / PARTIAL':'PARTIAL'}<br>CONTINUANCE ............. ${S.flags.ending==='TERMINATE'?'COMPROMISED':'ACTIVE'}${S.flags.trial13?'<hr>TRIAL XIII .............. AVAILABLE':''}</div><div class="center big" style="margin-top:35px">CONTINUANCE</div>${S.flags.trial13?'<button class="btn red" style="margin-top:22px" onclick="Game.enter13()">ENTER TRIAL XIII // ZERO</button>':'<button class="btn dim" style="margin-top:22px" onclick="Game.home()">RETURN TO MAIN MENU</button>'}`;return `<div class="screen"><main class="wrap">${body}</main></div>`}
function t13(){let ph=S.flags.t13phase||'passage',body='';
if(ph==='passage')body=`<div class="zero-void"><div class="kicker">UNREGISTERED SPACE // NO CAMERA FEED</div><h1 class="zero-title">ZERO</h1><div class="storybox"><p>The first chamber is waiting for you again.</p><p>Except this time, you remember the sentence.</p><p class="memory">DON’T LET HIM KNOW YOU REMEMBER.</p><p>You press your palm against the west wall. The scratched letters continue beneath a maintenance plate.</p><p>Behind it is a switch JANUS never showed you.</p></div><button class="btn red" onclick="Game.zeroPassage()">REMOVE THE PANEL</button></div>`;
else if(ph==='timeline')body=`<div class="kicker">PROJECT ZERO // RECOVERY SYSTEM</div><div class="big">WHO CAME FIRST?</div><div class="objective"><b>CONDITION 01 // TIMELINE</b>Three archives disagree. Find the impossible chronology.</div><div class="zero-archive"><b>ARCHIVE 00</b><p>21:02 — Participant admitted under pre-designation identity.<br>21:19 — Memory restoration anomaly recorded.<br>21:26 — Designation SUBJECT 00 issued.</p></div><div class="zero-archive"><b>ARCHIVE 13</b><p>20:44 — Operator 13 approves cognitive persistence trial.<br>21:31 — Operator 13 orders containment after contact event.</p></div><div class="zero-archive"><b>ARCHIVE A</b><p>20:58 — ARCHITECT interview transcript references “Subject 00.”<br>22:03 — Architect cognitive instance officially initialized.</p></div><div class="objective"><b>QUESTION</b>Which archive proves that a later identity has been written backward into the record?</div><div class="grid2"><button class="btn dim" onclick="Game.zeroTimeline('00')">ARCHIVE 00</button><button class="btn dim" onclick="Game.zeroTimeline('13')">ARCHIVE 13</button><button class="btn" onclick="Game.zeroTimeline('A')">ARCHIVE A</button></div>`;
else if(ph==='voices')body=`<div class="kicker">PROJECT ZERO // VOICE RECONSTRUCTION</div><div class="objective"><b>CONDITION 02</b>Identify the speakers by what they believe, not by what the archive calls them.</div><div class="transcript"><b>VOICE A:</b> “You cannot keep resetting people until they give you the answer you want.”<br><br><b>VOICE B:</b> “We are not resetting them. We are removing interference.”<br><br><b>VOICE A:</b> “And when they remember?”<br><br><b>VOICE B:</b> “Then we begin again.”</div><div class="grid2"><button class="card" onclick="Game.zeroVoices('13A')"><b>A = LATER 13</b><br><span class="muted">B = EARLY 13 / ARCHITECT SOURCE</span></button><button class="card" onclick="Game.zeroVoices('00A')"><b>A = SUBJECT 00</b><br><span class="muted">B = DR. VOSS</span></button><button class="card" onclick="Game.zeroVoices('ARCHA')"><b>A = ARCHITECT</b><br><span class="muted">B = SUBJECT 13</span></button></div>`;
else if(ph==='reveal')body=`<div class="zero-reveal"><div class="kicker">RECOVERY // 100%</div><h2>THE ARCHITECT IS NOT YOUR JAILER.</h2><p>He is an earlier cognitive snapshot of you — preserved from before you turned against CONTINUANCE.</p><p>Subject 13 became the person who wanted JANUS stopped.</p><p>The Architect remained the person who believed the experiment was necessary.</p><div class="memory">YOU HAVE BEEN ARGUING WITH THE PERSON YOU USED TO BE.</div><button class="btn" onclick="Game.zeroMessage()">OPEN SUBJECT 00 // FINAL MESSAGE</button></div>`;
else if(ph==='question')body=`<div class="storybox"><p class="speaker">SUBJECT 00 // RECOVERED</p><p>“You keep asking how to escape.”</p><p>“That is the wrong question.”</p><p>“Ask what continues.”</p></div><div class="objective"><b>FINAL RECOVERY</b>Answer in your own words. JANUS is no longer grading you.</div><textarea id="zeroAnswer" class="textarea input" placeholder="WHAT CONTINUES?"></textarea><button class="btn" onclick="Game.zeroAnswer()">RECORD ANSWER</button>`;
else if(ph==='choice')body=`<div class="kicker center">MAINTENANCE AUTHORITY // OUTSIDE JANUS</div><div class="big center">NO CONDITION REMAINS.</div><p class="muted center" style="margin:18px auto;max-width:560px">No Architect. No score. No correct answer. The next action belongs to you.</p><div class="grid2"><button class="btn red" onclick="Game.zeroEnd('DELETE')">DELETE CONTINUANCE DATA</button><button class="btn" onclick="Game.zeroEnd('PRESERVE')">PRESERVE CONTINUANCE DATA</button><button class="btn dim" style="grid-column:1/-1" onclick="Game.zeroEnd('WALK')">TOUCH NOTHING // WALK AWAY</button></div>`;
else body=`<div class="zero-ending"><div class="kicker">PROJECT ZERO // CLOSED</div><div class="big">${S.flags.zeroEnding==='DELETE'?'THE MACHINES FALL SILENT':S.flags.zeroEnding==='PRESERVE'?'THE MACHINES CONTINUE HUMMING':'FOR THE FIRST TIME, NOBODY TELLS YOU WHAT HAPPENS NEXT'}</div><p>${S.flags.zeroEnding==='DELETE'?'Behind you, twelve lights go dark. The thirteenth was never connected.':S.flags.zeroEnding==='PRESERVE'?"You tell yourself preservation is not permission. You have told yourself convincing things before.":'You leave the maintenance console untouched and walk toward a door that has no number.'}</p><div class="report">TRIAL XIII .............. SURVIVED<br>SUBJECT 13 .............. UNREGISTERED<br>PROJECT ZERO ............ RECOVERED<br>CONTINUANCE DATA ........ ${S.flags.zeroEnding}</div><div class="continuance-logo">CONTINUANCE</div><button class="btn" onclick="Game.newContinuance()">NEW CONTINUANCE</button><button class="btn dim" style="margin-top:8px" onclick="Game.home()">MAIN MENU</button></div>`;
return `<div class="screen zero-screen"><main class="wrap">${body}</main></div>`}

function arrival(n){let x=ARR[n]||ARR[1];let narration=x[1]+"\n\n"+x[2];return `<div class="screen arrival"><div class="arrival-card"><div class="arrival-title">${x[0]}</div><div class="arrival-door-stage"><div id="arrivalDoor" class="arrival-door"><div class="plate"><strong>${String(n).padStart(2,'0')}</strong><span>CONDITION SEALED</span></div></div></div><div class="arrival-copy typewrite" data-type="${esc(narration)}" data-reveal="doorHold"></div><div class="arrival-brief"><b>${esc(S.difficulty||'MEDIUM')} // TRIAL BRIEFING</b>${esc(trialBrief(n))}</div><button id="doorHold" class="btn hold-btn reveal-after-type" onclick="Game.enterRoom(${n})"><span class="holdfill"></span><span>TAP // OPEN CHAMBER</span></button></div></div>`}

t2Inspect(id){if(id==='reservoir'&&S.flags.t2exam?.includes('reservoir')){S.flags.t2record=true;S.flags.t2recordNote='A folded maintenance slip is wedged behind the gauge. SUBJECT 13 / PREVIOUS CYCLE. The date predates the accident you remember.';}let a=S.flags.t2exam||[];if(!a.includes(id))S.flags.t2exam=[...a,id];save();fx('tap');render()},
advanceT1ToT2(){Game.advanceNarrative(1)},advanceNarrative(n){let key='interlude'+n,p=S.flags[key]||0,max=n===2?4:3;if(p<max){S.flags[key]=p+1;save();fx('step');render()}else{S.flags['betweenSeen'+(n+1)]=true;save();Game.loadChamber(n+1)}},
